<svg width="360" height="96" viewBox="0 0 360 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ARH 主 Logo 横向锁定版：标记 + 字标 + 副标 -->
  <!-- 坐标标记 -->
  <rect x="8" y="16" width="64" height="64" rx="13" fill="#0f172a"/>
  <line x1="15" y1="48" x2="65" y2="48" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="40" y1="23" x2="40" y2="73" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="51" cy="37" r="9" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="51" cy="37" r="4" fill="#f8fafc"/>
  <!-- 字标 -->
  <text x="92" y="52" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="2" fill="#0f172a">ARH</text>
  <!-- 副标 -->
  <text x="94" y="74" font-family="'Courier New',monospace" font-size="11" letter-spacing="3" fill="#94a3b8">POLITICAL ARCHIVE</text>
</svg>
