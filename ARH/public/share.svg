<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ARH 微信/OG 分享卡 600×600 · 暗色档案风 -->
  <defs>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#ffffff" opacity="0.015"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#0f172a"/>
  <rect width="600" height="600" fill="url(#scan)"/>
  <rect x="24" y="24" width="552" height="552" rx="4" stroke="#334155" stroke-width="1.5"/>

  <!-- 角标 -->
  <path d="M44 66 V44 H66" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M556 534 V556 H534" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- 顶部标签 -->
  <text x="300" y="118" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" letter-spacing="7" fill="#64748b">ARH POLITICAL ARCHIVE</text>

  <!-- 坐标标记 -->
  <g transform="translate(240,168)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="14" y1="60" x2="106" y2="60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 5"/>
    <line x1="60" y1="14" x2="60" y2="106" stroke="#64748b" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="82" cy="40" r="16" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="82" cy="40" r="7" fill="#f8fafc"/>
  </g>

  <!-- 主标题 -->
  <text x="300" y="378" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="800" letter-spacing="4" fill="#f8fafc">意识形态坐标测试</text>

  <!-- 分隔线 -->
  <line x1="180" y1="416" x2="420" y2="416" stroke="#334155" stroke-width="1.5"/>

  <!-- 副标：七维 -->
  <text x="300" y="456" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" letter-spacing="6" fill="#94a3b8">七维坐标 · 严谨算法 · 专属鉴定</text>

  <!-- 底部维度 -->
  <text x="300" y="524" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" letter-spacing="3" fill="#475569">经济 权力 文化 认同 生态 科技 玄学</text>
</svg>
