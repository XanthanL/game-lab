<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ARH 意识形态坐标 · 品牌标记：坐标准星 + 定位点 -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="#0f172a"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#334155" stroke-width="1"/>
  <!-- 坐标轴（原点在中心，虚线呼应雷达栅格） -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <!-- 定位点（你所处的坐标）：右上象限，白色实心 + 准星环 -->
  <circle cx="43" cy="21" r="9" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="43" cy="21" r="4" fill="#f8fafc"/>
  <!-- 角标：档案登记标记 -->
  <path d="M10 16 V10 H16" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M54 48 V54 H48" stroke="#475569" stroke-width="1.5" fill="none"/>
</svg>
