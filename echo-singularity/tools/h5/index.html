<!-- ══ 迷你 CommonJS 装载器 ══
     浏览器不认 require，这里用「每段脚本前后各插一个 __begin/__end」的办法，
     给每个文件一个独立的 module 对象。无需打包器，file:// 直接双击可跑。 -->
<script>
(function () {
  var reg = {}, pending = null, cur = null;
  Object.defineProperty(window, 'module', {
    configurable: true,
    get: function () { return cur; }
  });
  window.__begin = function (name) { cur = { exports: {} }; pending = name; };
  window.__end = function () {
    if (pending) reg[pending] = cur.exports;
    pending = null; cur = null;
  };
  window.require = function (p) {
    var m = String(p).replace(/^.*\//, '').replace(/\.js$/, '');
    var v = reg[m];
    if (!v) throw new Error('模块未加载: ' + p + '（登记名 ' + m + '）');
    return v;
  };
  window.__reg = reg;
})();
</script>
