<script>
"use strict";
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const pack=(r,g,b)=>(0xFF000000|((b<0?0:(b>255?255:b|0))<<16)|((g<0?0:(g>255?255:g|0))<<8)|(r<0?0:(r>255?255:r|0)))>>>0;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let VW=480,VH=300;
const world=document.createElement('canvas');
const wctx=world.getContext('2d');
let imgData,buf32,zBuffer;
function computeSize(){
  const w=window.innerWidth||document.documentElement.clientWidth||480;
  const h=window.innerHeight||document.documentElement.clientHeight||300;
  const aspect=w/h;
  let vw,vh;
  if(aspect>=1){vh=300;vw=Math.round(300*aspect);if(vw>640)vw=640;}
  else{vw=360;vh=Math.round(vw/aspect);if(vh>780)vh=780;}
  return [vw,vh];
}
function setupBuffers(){
  [VW,VH]=computeSize();
  canvas.width=VW;canvas.height=VH;
  world.width=VW;world.height=VH;
  imgData=wctx.createImageData(VW,VH);
  buf32=new Uint32Array(imgData.data.buffer);
  zBuffer=new Float32Array(VW);
}
setupBuffers();
ctx.imageSmoothingEnabled=false;

const MAPS=[
[
"############################",
"#D........#........#.A.....#",
"#.........#........#...P...#",
"#..P.......................#",
"#.........#........#....B..#",
"#####..####J....J#####..####",
"#......#........#..........#",
"#..W...#...A....#..........#",
"#......#...................#",
"#.......#........#..U......#",
"#......#........#..........#",
"######..###J....J..#########",
"#......#........#..........#",
"#..P...#........#..P.......#",
"#......X........#..B.......#",
"#..C...#........#..........#",
"#......#........#..........#",
"#......#...K....#..........#",
"#......#........#..........#",
"############################",
],
[
"######################",
"#U........#..........#",
"#.S.......#..S.......#",
"#.........#..........#",
"#..X......#...X......#",
"#.........#..........#",
"######.....########...",
"#.........#..........#",
"#..P......#..P.......#",
"#.........#..........#",
"#.........#...B......#",
"#....................#",
"#..B.................#",
"######################",
],
];

let lvl=0;
const tiles=MAPS.map(m=>m.map(r=>r.split('')));
function tile(x,y){const t=tiles[lvl];if(x<0||y<0||x>=t[0].length||y>=t.length)return '#';return t[y][x];}
function solid(x,y){const t=tile(x,y);return t==='#'||t==='S'||t==='J'||t==='B'||t==='C'||t==='X'||t==='D';}
function hashInt(x,y){x|=0;y|=0;let h=(x*73856093)^(y*19349663);h^=h>>>13;h=(h*1274126177)>>>0;return h&255;}
function snoise(x,y){const fx=x&63,fy=y&63;const a=hashInt(fx,fy)%256,b=hashInt(fx+1,fy)%256,c=hashInt(fx,fy+1)%256,d=hashInt(fx+1,fy+1)%256;const u=fx*0.015625,v=fy*0.015625;const uu=u*u*(3-2*u),vv=v*v*(3-2*v);return (a+(b-a)*uu+(c-a)*vv+(a-b-c+d)*uu*vv)/255;}

function genTex(fn){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const d=g.createImageData(64,64);const u=new Uint32Array(d.data.buffer);for(let y=0;y<64;y++)for(let x=0;x<64;x++)u[y*64+x]=fn(x,y);g.putImageData(d,0,0);c.u32=u;return c;}
function finishTex(c){c.u32=new Uint32Array(c.getContext('2d').getImageData(0,0,64,64).data.buffer);return c;}

const wood=genTex((x,y)=>{
  const plank=y%16;
  let v=70+snoise(x*0.22,y*0.8)*40+(snoise(x*1.3,y*2.1)-0.5)*26;
  if(plank===0||plank===15){v*=0.4;}
  else if(plank===1||plank===14){v+=14;}
  if(snoise(x*0.5,y*0.5)>0.88&&plank>2&&plank<13){v-=24;}
  if(hashInt(x*3,y*5)%120===0){v+=16;}
  return pack(clamp(v,0,255),clamp(v*0.72,0,255),clamp(v*0.52,0,255));
});
const darkwood=genTex((x,y)=>{
  const plank=y%16;
  let v=24+snoise(x*0.3,y*0.9)*16;
  if(plank===0||plank===15){v*=0.55;}
  if(plank===1){v+=10;}
  if(snoise(x*1.4,y*3.2)>0.8){v+=12;}
  return pack(clamp(v*0.9,0,255),clamp(v*0.75,0,255),clamp(v*0.6,0,255));
});
const shoji=genTex((x,y)=>{
  const d=Math.hypot(x-32,y-28)/46;
  let v=200-snoise(x*0.5,y*0.5)*9+24*Math.max(0,1-d);
  const gx=x%16,gy=y%16;
  if(gx===0||gy===0){v*=0.8;}
  if(gx===15||gy===15){v*=0.92;}
  if(y>52){v*=0.8;}
  return pack(clamp(v,0,255),clamp(v*0.97,0,255),clamp(v*0.88,0,255));
});
const redwood=genTex((x,y)=>{

function svgUrl(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
function makeSpriteCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g);return c;}

// SVG 精灵烘焙：显式声明 width/height（缺失时浏览器会退回 300x150 的默认位图，
// 导致按 viewBox 尺寸取源矩形时只画出左上一角），再光栅化到固定尺寸的离屏 canvas。
// 返回的 canvas 引用稳定且 width/height 立即可用，渲染路径无需等待 onload。
function svgSprite(w,h,body,fb){
  const ss=Math.max(1,Math.min(10,Math.round(320/Math.max(w,h))));
  const c=makeSpriteCanvas(Math.round(w*ss),Math.round(h*ss),()=>{});
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=true;
  if(fb)g.drawImage(fb,0,0,c.width,c.height);
  const img=new Image();
  img.onload=()=>{g.clearRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.ready=true;};
  img.src=svgUrl('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+body+'</svg>');
  return c;
}

  setupTouch();
}
function setupTouch(){
  const stick=document.getElementById('stick'),stickKnob=document.getElementById('stickKnob');
  const R=55;
  const touches={};
  const inBtn=t=>t.target&&t.target.closest&&t.target.closest('.tbtn');
  function onStart(e){
    if(state!=='playing'||paused)return;
    let used=false;
    for(const t of e.changedTouches){
      if(inBtn(t))continue;
      used=true;
      const x=t.clientX,y=t.clientY;
      if(x>window.innerWidth*0.5){touches[t.identifier]={zone:'look',lx:x,ly:y};}
      else{touches[t.identifier]={zone:'move',ox:x,oy:y,lx:x,ly:y};stick.style.left=x+'px';stick.style.top=y+'px';stick.style.display='block';stickKnob.style.left=x+'px';stickKnob.style.top=y+'px';stickKnob.style.display='block';}
    }
    if(used&&e.cancelable)e.preventDefault();
  }
  function onMove(e){
    let used=false;
    for(const t of e.changedTouches){
      const tc=touches[t.identifier];if(!tc)continue;
      used=true;
      const x=t.clientX,y=t.clientY;
      if(tc.zone==='move'){
        let dx=x-tc.ox,dy=y-tc.oy;const d=Math.hypot(dx,dy);
        if(d>R){dx=dx/d*R;dy=dy/d*R;}
        stickKnob.style.left=(tc.ox+dx)+'px';stickKnob.style.top=(tc.oy+dy)+'px';
        joy.s=clamp(dx/R,-1,1);joy.f=-clamp(dy/R,-1,1);
        if(Math.hypot(joy.s,joy.f)<0.25){joy.s=0;joy.f=0;}
      }else{
        const dx=x-tc.lx;
        if(dx)hideLookHint();
        mouseDX+=dx*TOUCH_LOOK*lookSens;
        tc.lx=x;tc.ly=y;
      }
    }
    if(used&&e.cancelable)e.preventDefault();
  }
  function onEnd(e){
    for(const t of e.changedTouches){
      const tc=touches[t.identifier];if(!tc)continue;
      if(tc.zone==='move'){joy.f=0;joy.s=0;stick.style.display='none';stickKnob.style.display='none';}
      delete touches[t.identifier];
    }
  }
  document.addEventListener('touchstart',onStart,{passive:false});
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd,{passive:false});
  document.addEventListener('touchcancel',onEnd,{passive:false});
}

// 长按 ◀ ▶ 持续转向（触屏与鼠标通用）
function bindTurnButton(id,dir){
  const el=document.getElementById(id);if(!el)return;
  const on=e=>{
    if(state!=='playing'||paused)return;
    if(e.cancelable)e.preventDefault();
    turnDir=dir;el.classList.add('on');hideLookHint();
  };
  const off=()=>{if(turnDir===dir)turnDir=0;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

let AC=null,master=null,noiseBuf=null,muted=false,ambGains=[];
function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;
  const wg=AC.createGain();wg.gain.value=0.05;
  const lfo=AC.createOscillator();lfo.frequency.value=0.08;
  const lg=AC.createGain();lg.gain.value=0.02;
  lfo.connect(lg);lg.connect(wg.gain);
  src.connect(lp);lp.connect(wg);wg.connect(master);
  src.start();lfo.start();
  ambGains.push(wg);
  [48,48.7,72.5].forEach(f=>{const o=AC.createOscillator();o.frequency.value=f;o.type='sine';const g=AC.createGain();g.gain.value=f>60?0.008:0.022;o.connect(g);g.connect(master);o.start();ambGains.push(g);});
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.8;}
function at(){return AC.currentTime;}
function noiseDur(dur){const s=AC.createBufferSource();s.buffer=noiseBuf;s.start(at()+0.01,Math.random(),dur);return s;}
function footstep(){const t=at();const s=noiseDur(0.11);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;const g=AC.createGain();g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.22,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);s.connect(lp);lp.connect(g);g.connect(master);s.start(t);const o=AC.createOscillator();o.frequency.value=65+Math.random()*10;o.type='sine';const og=AC.createGain();og.gain.setValueAtTime(0.0001,t);og.gain.linearRampToValueAtTime(0.08,t+0.01);og.gain.exponentialRampToValueAtTime(0.0001,t+0.1);o.connect(og);og.connect(master);o.start(t);o.stop(t+0.12);}
function beat(){const t=at();for(let i=0;i<2;i++){const tt=t+i*0.32;const o=AC.createOscillator();o.frequency.value=52;o.type='sine';const g=AC.createGain();g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(0.5,tt+0.015);g.gain.exponentialRampToValueAtTime(0.0001,tt+0.16);o.connect(g);g.connect(master);o.start(tt);o.stop(tt+0.2);}}
function cricket(){const t=at();for(let i=0;i<3;i++){const tt=t+i*0.11;const o=AC.createOscillator();o.frequency.value=4200+Math.random()*600;o.type='sine';const g=AC.createGain();g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(0.03,tt+0.012);g.gain.exponentialRampToValueAtTime(0.0001,tt+0.05);o.connect(g);g.connect(master);o.start(tt);o.stop(tt+0.07);}}
function whisper(){const t=at();const s=noiseDur(2.4);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=7;const g=AC.createGain();const tr=AC.createOscillator();tr.frequency.value=11;const tg=AC.createGain();tg.gain.value=0.05;tr.connect(tg);tg.connect(g.gain);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.14,t+0.25);g.gain.setValueAtTime(0.14,t+1.5);g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);s.connect(bp);bp.connect(g);if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=rand(-0.7,0.7);g.connect(p);p.connect(master);}else{g.connect(master);}s.start(t);tr.start(t);tr.stop(t+2.5);}
function knock(){const t=at();for(let i=0;i<3;i++){const tt=t+i*0.24;const o=AC.createOscillator();o.frequency.value=72;o.type='sine';const g=AC.createGain();g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(0.42,tt+0.008);g.gain.exponentialRampToValueAtTime(0.0001,tt+0.12);o.connect(g);g.connect(master);o.start(tt);o.stop(tt+0.14);const s=noiseDur(0.08);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=480;const sg=AC.createGain();sg.gain.setValueAtTime(0.0001,tt);sg.gain.linearRampToValueAtTime(0.3,tt+0.006);sg.gain.exponentialRampToValueAtTime(0.0001,tt+0.09);s.connect(lp);lp.connect(sg);sg.connect(master);s.start(tt);}}
function creak(){const t=at();const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(85,t);o.frequency.linearRampToValueAtTime(140,t+0.3);o.frequency.linearRampToValueAtTime(60,t+0.9);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.09,t+0.15);g.gain.exponentialRampToValueAtTime(0.0001,t+1.0);o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+1.05);}
function bell(f,delay,gain){const t0=at()+delay;const o=AC.createOscillator();o.frequency.value=f;o.type='sine';const vib=AC.createOscillator();vib.frequency.value=5.5;const vg=AC.createGain();vg.gain.value=f*0.004;vib.connect(vg);vg.connect(o.frequency);const g=AC.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(gain,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.9);o.connect(g);g.connect(master);o.start(t0);vib.start(t0);o.stop(t0+1);vib.stop(t0+1);const o2=AC.createOscillator();o2.frequency.value=f*2.01;o2.type='sine';const g2=AC.createGain();g2.gain.setValueAtTime(0.0001,t0);g2.gain.linearRampToValueAtTime(gain*0.35,t0+0.01);g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);o2.connect(g2);g2.connect(master);o2.start(t0);o2.stop(t0+0.6);}
function dollPickup(){[1046,988,880,784].forEach((f,i)=>bell(f,i*0.16,0.09));}
function keyPickup(){const t=at();for(let i=0;i<2;i++){const tt=t+i*0.09;const s=noiseDur(0.05);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3400;bp.Q.value=12;const g=AC.createGain();g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(0.16,tt+0.005);g.gain.exponentialRampToValueAtTime(0.0001,tt+0.07);s.connect(bp);bp.connect(g);g.connect(master);s.start(tt);}bell(1760,0.02,0.06);}
function shriek(dur){const t=at();const sh=AC.createWaveShaper();const curve=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;curve[i]=Math.tanh(4*x);}sh.curve=curve;const g=AC.createGain();g.gain.value=0.85;sh.connect(g);g.connect(master);[-0.06,0.08].forEach(det=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(480,t);o.frequency.exponentialRampToValueAtTime(90,t+dur);o.detune.value=det*440;const og=AC.createGain();og.gain.value=0.6;o.connect(og);og.connect(sh);o.start(t);o.stop(t+dur+0.05);});const s=noiseDur(dur*0.6);const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;const sg=AC.createGain();sg.gain.setValueAtTime(0.0001,t);sg.gain.linearRampToValueAtTime(0.5,t+0.03);sg.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.6);s.connect(hp);hp.connect(sg);sg.connect(sh);s.start(t);const r=AC.createOscillator();r.frequency.value=40;r.type='sine';const rg=AC.createGain();rg.gain.setValueAtTime(0.0001,t);rg.gain.linearRampToValueAtTime(0.6,t+0.04);rg.gain.exponentialRampToValueAtTime(0.0001,t+1.2);r.connect(rg);rg.connect(master);r.start(t);r.stop(t+1.3);const ring=AC.createOscillator();ring.frequency.value=2800;ring.type='sine';const ringG=AC.createGain();ringG.gain.setValueAtTime(0.0001,t+0.9);ringG.gain.linearRampToValueAtTime(0.05,t+1.0);ringG.gain.exponentialRampToValueAtTime(0.0001,t+2.4);ring.connect(ringG);ringG.connect(master);ring.start(t+0.9);ring.stop(t+2.5);}
function deathSound(){const t=at();const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(55,t+3);const sh=AC.createWaveShaper();const curve=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;curve[i]=Math.tanh(3*x);}sh.curve=curve;const g=AC.createGain();g.gain.value=0.9;o.connect(sh);sh.connect(g);g.connect(master);o.start(t);o.stop(t+3.2);const s=noiseDur(2.5);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;const sg=AC.createGain();sg.gain.setValueAtTime(0.0001,t);sg.gain.linearRampToValueAtTime(0.6,t+0.05);sg.gain.exponentialRampToValueAtTime(0.0001,t+2.5);s.connect(lp);lp.connect(sg);sg.connect(sh);s.start(t);const ring=AC.createOscillator();ring.frequency.value=2350;ring.type='sine';const rg=AC.createGain();rg.gain.setValueAtTime(0.0001,t+1.4);rg.gain.linearRampToValueAtTime(0.08,t+1.7);rg.gain.exponentialRampToValueAtTime(0.0001,t+3.2);ring.connect(rg);rg.connect(master);ring.start(t+1.4);ring.stop(t+3.3);}
function winSound(){const t=at();ambGains.forEach(g=>g.gain.linearRampToValueAtTime(0.0001,t+2));[523.25,659.25,784,1046.5].forEach((f,i)=>bell(f,0.3+i*0.25,0.1));}

let state='title';
let seq=null,timeSec=0,sanity=100,startTime=0;
let dollsTaken=0,hasKey=false;
let toast={text:'',t:0};
let nextEventAt=8,lastScareAt=-99,nextHeart=0,nextCricket=2;
let faceFar=null,flickerEvent=0,shadowFlash=0,flashWhite=0,flashRed=0,flashBlack=0;
let bobT=0,stepAcc=0,bobY=0;

function tension(){return clamp(0,1,(timeSec/60)*0.22+dollsTaken*0.12+(100-sanity)*0.01+(lvl===1?0.2:0));}
function toastMsg(s){toast={text:s,t:2.8};}

function spawnDistantFace(){const far=reachableByLevel[lvl].filter(p=>Math.hypot(p.x-player.x,p.y-player.y)>3.5);if(!far.length)return;const p=far[(Math.random()*far.length)|0];faceFar={x:p.x,y:p.y,t:rand(5,9)};whisper();toastMsg('……前方似乎有什么东西');}

function doScare(){lastScareAt=timeSec;mouseDX=0;sanity-=28;if(sanity<0)sanity=0;if(sanity<=0){seq={mode:'death',t:0};deathSound();flashRed=1;}else{seq={mode:'scare',t:0};shriek(1.5);flashWhite=0.5;toastMsg('……!!');}}

function fireEvent(){const tn=tension();const r=Math.random();
if(tn>0.42&&r<0.15&&timeSec-lastScareAt>26){doScare();return;}
if(r<0.32){whisper();shadowFlash=0.8;toastMsg('……有人在耳边低语');}
else if(r<0.52){knock();flickerEvent=1.4;toastMsg('……墙壁里传来敲击声');}
else if(r<0.85){spawnDistantFace();}
else{flickerEvent=1.2;creak();shadowFlash=0.6;}}

function switchLevel(){
  lvl=lvl===0?1:0;
  const s=spawns[lvl];
  player.x=s.x;player.y=s.y;
  player.dirX=0;player.dirY=-1;
  player.planeX=0.66;player.planeY=0;
  mouseDX=0;ePressed=false;
  flashBlack=1;
  toastMsg(lvl===0?'回到了一层……':'你进入了地下室……前方楼梯可返回一层');
}

function interact(){
  const fx=Math.floor(player.x+player.dirX*0.55),fy=Math.floor(player.y+player.dirY*0.55);
  const ft=tile(fx,fy);
  if(ft==='D'){
    if(!hasKey)toastMsg('大门锁着……需要钥匙');
    else if(dollsTaken<6)toastMsg('纸人偶还没有找齐 ('+dollsTaken+'/6)……');
    else{seq={mode:'win',t:0};winSound();flashWhite=0.3;}
    return;
  }
  if(ft==='U'){switchLevel();return;}
  if(!keyItem.taken&&keyItem.lvl===lvl&&Math.hypot(keyItem.x-player.x,keyItem.y-player.y)<0.8){keyItem.taken=true;hasKey=true;keyPickup();toastMsg('大门钥匙……到手了');lastScareAt=timeSec;return;}
  for(const d of dolls){if(d.taken||d.lvl!==lvl)continue;if(Math.hypot(d.x-player.x,d.y-player.y)<0.8){d.taken=true;dollsTaken++;dollPickup();toastMsg('纸人偶……找到了 ('+dollsTaken+'/6)');lastScareAt=timeSec;if(dollsTaken>=3)shadowFlash=0.5;return;}}
}

function move(dt){
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp)f+=1;
  if(keys.KeyS||keys.ArrowDown)f-=1;
  if(keys.KeyD||keys.ArrowRight)s+=1;
  if(keys.KeyA||keys.ArrowLeft)s-=1;
  f+=joy.f;s+=joy.s;
  let rot=mouseDX*0.0022;mouseDX=0;
  if(turnDir)rot+=turnDir*BTN_TURN*lookSens*dt;
  if(rot){const c=Math.cos(rot),sn=Math.sin(rot);const dx=player.dirX*c-player.dirY*sn,dy=player.dirX*sn+player.dirY*c;player.dirX=dx;player.dirY=dy;const px=player.planeX*c-player.planeY*sn,py=player.planeX*sn+player.planeY*c;player.planeX=px;player.planeY=py;}
  if(f||s){
    const sp=2.7*dt;
    const mx=player.dirX*f+player.planeX*s*0.6,my=player.dirY*f+player.planeY*s*0.6;
    const len=Math.hypot(mx,my)||1;
    const nx=player.x+mx/len*sp,ny=player.y+my/len*sp;
    if(!solidAt(nx,player.y))player.x=nx;
    if(!solidAt(player.x,ny))player.y=ny;
    stepAcc+=sp;bobT+=dt*9;
    if(stepAcc>0.42){stepAcc-=0.42;footstep();}
  }else{bobT=0;}
  bobY=Math.sin(bobT)*2.6;
}

function update(dt){
  timeSec+=dt;
  if(state!=='playing'||paused)return;
  if(seq){
    seq.t+=dt;
    if(seq.mode==='scare'&&seq.t>1.1){seq=null;}
    else if(seq.mode==='death'&&seq.t>3.2){state='dead';document.getElementById('dead').style.display='flex';if(document.pointerLockElement)document.exitPointerLock();}
    else if(seq.mode==='win'&&seq.t>2.6){state='win';const m=(timeSec-startTime)/60|0,ss=(timeSec-startTime)%60|0;document.getElementById('winstats').textContent='你冲出了大门。  用时 '+m+'分'+('0'+ss).slice(-2)+'秒  纸人偶 '+dollsTaken+' 体';document.getElementById('win').style.display='flex';if(document.pointerLockElement)document.exitPointerLock();}
  }else if(isTouch||document.pointerLockElement===canvas){
    move(dt);
    if(ePressed){ePressed=false;interact();}
    if(lvl===1&&timeSec-lastScareAt>4)sanity=Math.max(0,sanity-0.8*dt);
    if(timeSec-lastScareAt>10&&sanity<100)sanity=Math.min(100,sanity+2.5*dt);
    if(sanity<70&&timeSec>=nextHeart){nextHeart=timeSec+0.55+0.85*(sanity/70);beat();}
    if(timeSec>=nextCricket){nextCricket=timeSec+1.8+Math.random()*3.5;cricket();}
    if(timeSec>=nextEventAt){nextEventAt=timeSec+3.5+Math.random()*6.5*(1.15-tension());fireEvent();}
  }
  if(faceFar){faceFar.t-=dt;if(faceFar.t<=0)faceFar=null;}
  if(flickerEvent>0)flickerEvent-=dt;
  if(shadowFlash>0)shadowFlash-=dt;
  if(flashWhite>0)flashWhite-=dt*1.6;
  if(flashRed>0)flashRed-=dt*1.3;
  if(flashBlack>0)flashBlack-=dt*1.8;
  if(toast.t>0)toast.t-=dt;
}

const FLOOR_COLORS={T:[138,114,84],W:[86,60,42],G:[44,58,36],S:[54,54,58],D:[48,42,34]};
function floorStyle(x,y){
  const ix=Math.floor(x),iy=Math.floor(y);
  if(lvl===1)return hashInt(ix*2,iy*3)%9===0?'D':'S';
  if(iy>=6&&iy<=10&&ix>=1&&ix<=6)return 'G';
  if(iy>=12&&iy<=18&&ix>=8&&ix<=15)return 'S';
  if(iy<=5&&ix>=10&&ix<=18)return 'W';
  return 'T';
}

function render(tSec){
  const flicker=(0.85+0.15*Math.sin(tSec*13.7)+Math.random()*0.05)*(flickerEvent>0?0.35:1)*(lvl===1?0.82:1);
  const horizon=VH>>1;
  const hw=VH/2;
  const tl=tiles[lvl],tlW=tl[0].length,tlH=tl.length;
  for(let y=0;y<horizon;y++){const tt=y/horizon;const v=(5+30*tt)|0;buf32.fill(pack(v,v,Math.min(255,v+6)),y*VW,y*VW+VW);}
  for(let y=horizon;y<VH;y++){
    const rf=1/(y+0.5-horizon);
    const rowDist=hw*rf;
    for(let x=0;x<VW;x++){
      const cam=2*x/VW-1;
      const fx=player.x+rowDist*(player.dirX+player.planeX*cam);
      const fy=player.y+rowDist*(player.dirY+player.planeY*cam);
      const ix=Math.floor(fx),iy=Math.floor(fy);
      const c=FLOOR_COLORS[floorStyle(fx,fy)];
      const n=hashInt(fx*31,fy*57)%15-7;
      const fog=Math.min(1,rowDist/11);
      const fk=1-fog*0.85;
      const ex=fx-ix,ey=fy-iy;
      const edge=Math.min(ex,1-ex,ey,1-ey);
      const m=edge<0.035?0.72:1;
      let r=clamp((c[0]+n)*fk*flicker*m,0,255);
      let g=clamp((c[1]+n)*fk*flicker*m,0,255);
      let b=clamp((c[2]+n)*fk*flicker*m,0,255);
      if(iy>=0&&iy<tlH&&ix>=0&&ix<tlW&&tl[iy][ix]==='U'){r*=0.16;g*=0.18;b*=0.24;}
      buf32[y*VW+x]=pack(r,g,b);
    }
  }
  for(let x=0;x<VW;x++){
    const cam=2*x/VW-1;
    const rdx=player.dirX+player.planeX*cam,rdy=player.dirY+player.planeY*cam;
    let mapX=Math.floor(player.x),mapY=Math.floor(player.y);
    const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let stepX,stepY,sideX,sideY;
    if(rdx<0){stepX=-1;sideX=(player.x-mapX)*ddx;}else{stepX=1;sideX=(mapX+1-player.x)*ddx;}
    if(rdy<0){stepY=-1;sideY=(player.y-mapY)*ddy;}else{stepY=1;sideY=(mapY+1-player.y)*ddy;}
    let side=0;
    const hits=[];
    for(let i=0;i<96;i++){
      if(sideX<sideY){sideX+=ddx;mapX+=stepX;side=0;}else{sideY+=ddy;mapY+=stepY;side=1;}
      const t=tile(mapX,mapY);
      const isSolid=t==='#'||t==='S'||t==='B'||t==='C'||t==='X'||t==='D';
      if(isSolid){hits.push({perp:side===0?sideX-ddx:sideY-ddy,mapX,mapY,side,shoji:false});break;}
      if(t==='J'){hits.push({perp:side===0?sideX-ddx:sideY-ddy,mapX,mapY,side,shoji:true});if(hits.length>3)break;}
    }
    if(!hits.length){zBuffer[x]=1e9;continue;}
    hits.sort((a,b)=>b.perp-a.perp);
    zBuffer[x]=hits[hits.length-1].perp;
    for(const h of hits){
      const tex=wallTex(h.mapX,h.mapY).u32;
      let wallX=h.side===0?player.y+h.perp*rdy:player.x+h.perp*rdx;
      wallX-=Math.floor(wallX);
      let texX=(wallX*64)|0;if(h.side===1)texX=63-texX;
      const lineH=Math.round(VH/h.perp);
      const half=lineH/2;
      let y0=Math.floor(horizon-half),y1=Math.floor(horizon+half);
      if(y0<0)y0=0;if(y1>VH)y1=VH;
      if(y1<=y0)continue;
      const shade=Math.min(1,1.15/(1+h.perp*h.perp*0.11))*flicker*(h.side===1?0.8:1);
      const fogK=Math.min(1,h.perp/(lvl===1?9:11));
      const fogR=(8*fogK)|0,fogG=(9*fogK)|0,fogB=(13*fogK)|0;
      let texPos=(y0-(horizon-half))*64/lineH;
      const stepT=64/lineH;
      const a=h.shoji?0.5:1;
      for(let y=y0;y<y1;y++){
        const c=tex[((texPos|0)&63)*64+texX];texPos+=stepT;
        const r=Math.min(255,(c&255)*shade+fogR);
        const g=Math.min(255,((c>>>8)&255)*shade+fogG);
        const b=Math.min(255,((c>>>16)&255)*shade+fogB);
        const i=y*VW+x;
        if(a>=1){buf32[i]=pack(r,g,b);}
        else{const d=buf32[i];const dr=d&255,dg=(d>>>8)&255,db=(d>>>16)&255;buf32[i]=pack(r*a+dr*(1-a),g*a+dg*(1-a),b*a+db*(1-a));}
      }
    }
  }
  wctx.putImageData(imgData,0,0);

  ctx.save();
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);
  let shx=0,shy=0;
  if(seq){if(seq.mode==='scare'){shx=rand(-9,9);shy=rand(-9,9);}else if(seq.mode==='death'){shx=rand(-14,14);shy=rand(-14,14);}}
  ctx.translate(shx,shy);
  ctx.drawImage(world,0,bobY);

  const sprites=[];
  for(const d of dolls){if(!d.taken&&d.lvl===lvl)sprites.push({x:d.x,y:d.y,img:dollImg,scale:1.0,bob:true,phase:d.phase});}
  if(!keyItem.taken&&keyItem.lvl===lvl)sprites.push({x:keyItem.x,y:keyItem.y,img:keyImg,scale:0.9,bob:true,phase:0});
  for(const d of decor){if(d.lvl===lvl)sprites.push({x:d.x,y:d.y,img:d.img,scale:d.scale,glow:d.glow});}
  {
    const ts=tiles[lvl];
    const sb=lvl===1?1.3:1.05,sg=lvl===1?0.35:0;
    for(let y=0;y<ts.length;y++)for(let x=0;x<ts[0].length;x++)if(ts[y][x]==='U')sprites.push({x:x+0.5,y:y+0.5,img:stairsImg,scale:sb,glow:sg});
  }
  if(faceFar)sprites.push({x:faceFar.x,y:faceFar.y,img:faceImg(),scale:1.7,alpha:0.8+0.2*Math.sin(tSec*8)});
  sprites.sort((a,b)=>(Math.pow(b.x-player.x,2)+Math.pow(b.y-player.y,2))-(Math.pow(a.x-player.x,2)+Math.pow(a.y-player.y,2)));
  const invDet=1/(player.planeX*player.dirY-player.dirX*player.planeY);
  ctx.imageSmoothingEnabled=true;
  for(const s of sprites){
    const dx=s.x-player.x,dy=s.y-player.y;
    const tX=invDet*(player.dirY*dx-player.dirX*dy);
    const tY=invDet*(-player.planeY*dx+player.planeX*dy);
    if(tY<0.12)continue;
    const sx=(VW/2)*(1+tX/tY);
    const hh=(VH/tY)*s.scale;
    const ww=hh*(s.img.width/s.img.height);
    const fog=Math.max(0,1-tY/11);
    const yOff=s.bob?Math.sin(timeSec*2+s.phase)*2:0;
    const yTop=VH/2-hh/2+bobY+yOff;
    const x0=Math.floor(sx-ww/2),x1=Math.ceil(sx+ww/2);
    if(x1<=x0||x0>=VW||x1<=0)continue;
    let vis0=x1,vis1=x0;
    for(let xx=Math.max(0,x0);xx<Math.min(VW,x1);xx++){if(tY<zBuffer[xx]){if(xx<vis0)vis0=xx;if(xx>vis1)vis1=xx;}}
    if(vis1<vis0)continue;
    if(s.glow){
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      const gr=ctx.createRadialGradient(sx,VH/2-hh/2+bobY+yOff,2,sx,VH/2-hh/2+bobY+yOff,hh*1.1);
      gr.addColorStop(0,'rgba(255,200,120,'+(0.28*s.glow*fog).toFixed(3)+')');
      gr.addColorStop(1,'rgba(255,200,120,0)');
      ctx.fillStyle=gr;
      ctx.beginPath();ctx.rect(vis0,yTop-12,vis1-vis0+1,hh+24);ctx.clip();
      ctx.fillRect(vis0,yTop-12,vis1-vis0+1,hh+24);
      ctx.restore();
    }
    ctx.globalAlpha=fog*(s.alpha===undefined?1:s.alpha);
    let xx=vis0;
    while(xx<=vis1){
      if(tY>=zBuffer[xx]){xx++;continue;}
      let xe=xx+1;
      while(xe<=vis1&&tY<zBuffer[xe])xe++;
      const srcL=((xx-(sx-ww/2))/ww)*s.img.width;
      const srcR=((xe-(sx-ww/2))/ww)*s.img.width;
      ctx.drawImage(s.img,srcL,0,srcR-srcL,s.img.height,xx,yTop,xe-xx,hh);
      xx=xe;
    }
    ctx.globalAlpha=1;
  }
  ctx.globalAlpha=1;
  ctx.imageSmoothingEnabled=false;
  ctx.restore();

  if(flashBlack>0){ctx.fillStyle='rgba(0,0,0,'+clamp(flashBlack,0,1).toFixed(3)+')';ctx.fillRect(0,0,VW,VH);}
  if(seq&&seq.mode==='win'){
    const a=clamp(seq.t/2.5,0,1);
    ctx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  if(flashWhite>0){ctx.fillStyle='rgba(255,255,255,'+clamp(flashWhite,0,1).toFixed(3)+')';ctx.fillRect(0,0,VW,VH);}
  if(flashRed>0){ctx.fillStyle='rgba(120,10,10,'+(clamp(flashRed,0,1)*0.7).toFixed(3)+')';ctx.fillRect(0,0,VW,VH);}

  if(seq&&(seq.mode==='scare'||seq.mode==='death')){
    const s=seq;const img=faceImg();
    let sc=1,alpha=1,glitch=4;
    if(s.mode==='scare'){
      if(s.t<0.22){const k=s.t/0.22;const e=1-Math.pow(1-k,3);sc=0.1+1.45*e;glitch=8*k;alpha=1;}
      else if(s.t<0.7){sc=1.25+0.05*Math.sin(s.t*42);glitch=6;alpha=0.95;}
      else{sc=1.3;glitch=4;alpha=Math.max(0,1-(s.t-0.7)/0.4);}
      ctx.fillStyle='rgba(0,0,0,'+(0.55*(1-alpha)).toFixed(3)+')';ctx.fillRect(0,0,VW,VH);
    }else{
      const k=Math.min(1,s.t/0.3);const e=1-Math.pow(1-k,3);sc=0.1+1.6*e;glitch=10*k;alpha=1;
      if(s.t>1.2&&s.t<1.6)ctx.fillStyle='rgba(120,0,0,'+(((s.t-1.2)/0.4)*0.4).toFixed(3)+')';
      if(s.t>1.6)alpha=Math.max(0,1-(s.t-1.6)/1.0);
      ctx.fillStyle='rgba(0,0,0,'+(0.6*(1-alpha)).toFixed(3)+')';ctx.fillRect(0,0,VW,VH);
    }
    const fw=VW*sc,fh=VH*sc;
    const fx0=(VW-fw)/2,fy0=(VH-fh)/2;
    const slices=12,sliceH=fh/slices;
    ctx.imageSmoothingEnabled=true;
    ctx.globalAlpha=alpha;
    for(let i=0;i<slices;i++){
      const off=(Math.random()-0.5)*glitch;
      ctx.drawImage(img,0,(i*img.height/slices)|0,img.width,img.height/slices,fx0+off,fy0+i*sliceH,fw,sliceH+(Math.random()*4-2));
    }
    ctx.globalAlpha=1;
    ctx.imageSmoothingEnabled=false;
  }

  if(lvl===1){
    for(let i=0;i<3;i++){
      const ph=tSec*0.05+i*2.1;
      const mx2=((Math.sin(ph)*90+i*170)%(VW+220))-110;
      const my2=210+i*38+Math.sin(tSec*0.13+i)*16;
      const grd=ctx.createLinearGradient(mx2-95,0,mx2+95,0);
      grd.addColorStop(0,'rgba(190,200,214,0)');
      grd.addColorStop(0.5,'rgba(190,200,214,0.06)');
      grd.addColorStop(1,'rgba(190,200,214,0)');
      ctx.fillStyle=grd;ctx.fillRect(mx2-95,my2,190,16);
    }
  }

  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.35,VW/2,VH/2,VH*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.75)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);

  if(state==='playing'&&sanity<45){
    const a=(1-sanity/45)*0.5*(0.6+0.4*Math.sin(tSec*6));
    ctx.fillStyle='rgba(140,10,10,'+a.toFixed(3)+')';ctx.fillRect(0,0,VW,VH);
  }
  if(shadowFlash>0){
    const a=shadowFlash*0.7;
    const g=ctx.createRadialGradient(0,VH,VH*0.4,0,VH,10);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+a.toFixed(3)+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  }
  ctx.globalAlpha=0.06;
  const gx=((Math.random()*64)|0),gy=((Math.random()*64)|0);
  for(let yy=-64;yy<VH;yy+=64)for(let xx=-64;xx<VW;xx+=64)ctx.drawImage(grainImg,xx+gx,yy+gy);
  ctx.globalAlpha=1;

  if(state==='playing'){
    if(!isTouch){
      ctx.imageSmoothingEnabled=true;
      ctx.drawImage(dollImg,12,VH-38,11,19);
      ctx.drawImage(keyImg,14,VH-60,18,10);
      ctx.imageSmoothingEnabled=false;
      ctx.font='15px "Microsoft YaHei",serif';
      ctx.textAlign='left';
      ctx.fillStyle='rgba(220,220,220,0.85)';
      ctx.fillText('纸人偶  '+dollsTaken+' / 6',28,VH-20);
      ctx.fillText('钥匙　'+(hasKey?'有':'无'),28,VH-40);
      ctx.fillText(lvl===0?'一层':'地下室',12,18);
      ctx.textAlign='right';
      ctx.fillStyle='rgba(220,220,220,0.85)';
      ctx.fillText('精神',VW-12,VH-44);
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(VW-122,VH-38,110,10);
      const sc=sanity/100;
      const sg=ctx.createLinearGradient(VW-120,VH-36,VW-12,VH-36);
      sg.addColorStop(0,'rgb(70,150,70)');sg.addColorStop(0.5,'rgb(190,150,60)');sg.addColorStop(1,'rgb(190,50,45)');
      ctx.fillStyle=sg;ctx.fillRect(VW-120,VH-36,108*sc,6);
      ctx.strokeStyle='rgba(220,220,220,0.5)';ctx.strokeRect(VW-122,VH-38,110,10);
    }
    if(!seq){
      const fx=Math.floor(player.x+player.dirX*0.55),fy=Math.floor(player.y+player.dirY*0.55);
      const ft=tile(fx,fy);
      let hint='';
      if(ft==='D')hint=!hasKey?'大门锁着……需要钥匙':(dollsTaken>=6?'E 打开大门':'大门锁着……纸人偶未找齐 ('+dollsTaken+'/6)');
      else if(ft==='U')hint=lvl===0?'E 进入地下室':'E 回到一层';
      else if(!keyItem.taken&&keyItem.lvl===lvl&&Math.hypot(keyItem.x-player.x,keyItem.y-player.y)<1.4)hint='E 捡起钥匙';
      else{for(const d of dolls){if(!d.taken&&d.lvl===lvl&&Math.hypot(d.x-player.x,d.y-player.y)<1.4){hint='E 拾起纸人偶';break;}}}
      if(hint){ctx.textAlign='center';ctx.font='13px "Microsoft YaHei",serif';ctx.fillStyle='rgba(230,230,230,0.7)';ctx.fillText(hint,VW/2,VH-10);}
    }
    if(toast.t>0){
      const a=Math.min(1,toast.t*2);
      ctx.textAlign='center';ctx.font='16px "Microsoft YaHei",serif';
      ctx.fillStyle='rgba(235,235,235,'+a.toFixed(3)+')';
      ctx.fillText(toast.text,VW/2,VH/2+70);
    }
    if(isTouch)updateHud();
  }
}
function updateHud(){
  const mh=document.getElementById('mobileHud');
  if(state!=='playing'||paused){mh.style.display='none';return;}
  mh.style.display='flex';
  document.getElementById('hudLevel').textContent=lvl===0?'一层':'地下室';
  document.getElementById('hudDolls').textContent='纸人偶 '+dollsTaken+'/6';
  document.getElementById('hudKey').textContent='钥匙 '+(hasKey?'有':'无');
  document.getElementById('hudSanity').style.width=clamp(sanity,0,100)+'%';
}

function lock(){try{if(canvas.requestPointerLock){const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}
addEventListener('pointerlockchange',()=>{if(!isTouch&&document.pointerLockElement!==canvas&&state==='playing'&&!seq){document.getElementById('pause').style.display='flex';}});
document.getElementById('title').addEventListener('click',()=>{
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  state='playing';paused=false;startTime=timeSec;
  document.getElementById('title').style.display='none';
  showLookHint();
  lock();
});
document.getElementById('pause').addEventListener('click',()=>{document.getElementById('pause').style.display='none';if(isTouch){paused=false;}else{lock();}});
(function(){
  const box=document.getElementById('setting'),sl=document.getElementById('sens'),lb=document.getElementById('sensVal');
  if(!box||!sl||!lb)return;
  sl.value=String(lookSens);lb.textContent=lookSens.toFixed(1);
  ['click','pointerdown','pointerup','touchstart','touchend','touchmove','mousedown','mouseup'].forEach(t=>{
    box.addEventListener(t,e=>e.stopPropagation());
  });
  sl.addEventListener('input',()=>{
    const v=parseFloat(sl.value);
    if(!(v>0))return;
    lookSens=v;lb.textContent=v.toFixed(1);
    try{localStorage.setItem('ch_sens',String(v));}catch(e){}
  });
})();
document.getElementById('dead').addEventListener('click',()=>location.reload());
document.getElementById('win').addEventListener('click',()=>location.reload());
document.getElementById('btnE').addEventListener('click',()=>{if(state==='playing'&&!paused)ePressed=true;});
document.getElementById('btnM').addEventListener('click',()=>{toggleMute();});
document.getElementById('btnPause').addEventListener('click',()=>{if(state!=='playing')return;if(paused){paused=false;document.getElementById('pause').style.display='none';}else{paused=true;document.getElementById('pause').style.display='flex';}});
document.getElementById('dead').addEventListener('click',()=>location.reload());
document.getElementById('win').addEventListener('click',()=>location.reload());

let lastT=performance.now();
function loop(ts){
  requestAnimationFrame(loop);
  let dt=(ts-lastT)/1000;lastT=ts;
  dt=Math.min(0.05,dt);
  update(dt);
  render(timeSec);
}
requestAnimationFrame(loop);
window.addEventListener('resize',()=>{setupBuffers();});
window.addEventListener('orientationchange',()=>{setTimeout(setupBuffers,250);});
</script>
