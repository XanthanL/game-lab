name: Deploy to GitHub Pages

# 一个仓库只有一个 Pages 站点。本工作流把【仓库根目录】作为站点根发布，
# 所有子项目（resonance-era/、golden-wind/out/ 等）都是根下面的子路径。
# 不要再新增第二份 deploy 工作流去发布某个子目录 —— 那份会把整个域名覆盖成
# 那个子项目，根首页会消失。（2026-09-21 踩过：novel-deploy.yml 已删）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 发布前先扫一遍内部链接。构建产物写死根绝对路径（/_astro/、/about/）时页面照样打得开，
  # 只有资源在静默 404 —— 这个 job 是唯一会自动抓到它的地方。
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check internal links
        run: python .github/scripts/link_check.py --verbose

  deploy:
    needs: link-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
