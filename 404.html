<!doctype html>
<html lang="zh-CN"
      data-title-zh="404"
      data-title-en="404"
      data-desc-zh="这个地址下没有东西。"
      data-desc-en="Nothing lives at this address.">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="180x180" href="./assets/favicon-180.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon-180.png" />
<meta name="theme-color" content="#0000f2" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#eef1ff" media="(prefers-color-scheme: light)" />
<!-- 主题在样式生效前定好，避免刷新时闪一下白/黑 -->
<script>
(function () {
  var d = document.documentElement;
  d.classList.add("js");
  try {
    var t = localStorage.getItem("gl-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    d.setAttribute("data-theme", t);
    /* 风格：glass 液态玻璃（默认）、soft 新拟物、raw 新粗野、crete 砼核、
       xp Windows XP Luna、w7 Windows 7 Aero、w10 Windows 10 Metro */
    var st = localStorage.getItem("gl-style");
    var OK = ["glass","soft","raw","crete","xp","w7","w10","classic","dream","pool","weird","mc","gtavc","gtasa","gta4","gta5","pipboy","construct", "blueprint", "fc", "synthwave", "glitch", "clay", "cyberpunk", "rdr2", "p5", "aperture", "halo", "splatoon", "pokemon", "crt", "gb", "winamp", "dos", "mac7", "bauhaus", "deco", "memphis", "pop", "swiss", "vaporwave", "washi", "morandi", "skate", "decon", "ink", "futurism", "hermes","klein","diagonal","shanshui","borderlands"];
    d.setAttribute("data-style", OK.indexOf(st) !== -1 ? st : "glass");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="./assets/index.css" />
<style>
  .lost .row, .lost .toc { display: none; }
  .lost-list { margin-top: 30px; display: flex; flex-direction: column; gap: 2px; }
  /* 玻璃与 hover 反色扫入都由共享 .glass / Go Pro 规则提供，这里只管排版 */
  .lost-list a { font-family: var(--serif); font-size: 20px; color: var(--ink-2); text-decoration: none; padding: 10px 14px; border-bottom: 1px solid var(--line); border-radius: 14px; background: transparent; transition: color .4s var(--ease), padding-left .5s var(--ease); }
  .lost-list a:hover, .lost-list a:focus-visible { color: var(--ink); padding-left: 24px; border-bottom-color: transparent; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div><a href="./" style="color:inherit;text-decoration:none">GAME LAB</a> / 404</div>
    <div style="display:flex;align-items:center;gap:20px">
      <a href="https://github.com/XanthanL/game-lab" target="_blank" rel="noopener">GitHub</a>
      <button id="langToggle" class="lang-switch" type="button">中</button>
    </div>
  </div>

  <header class="hero lost">
    <div class="eyebrow"><span data-zh="这里什么都没有" data-en="Nothing here">这里什么都没有</span></div>
    <h1 style="font-size:clamp(70px,18vw,190px)">4<span class="i">·</span>4</h1>
    <p class="lede" style="max-width:44ch">
      <span data-zh="这个地址下没有作品——可能它换了目录，也可能从来就没有过。下面是几个一定在的地方。"
            data-en="No work lives at this address — it either moved or never existed. Here are some places that are definitely real."></span>
    </p>
    <div class="lost-list">
      <a href="./"><span data-zh="← 回到 GAME LAB 首页" data-en="← Back to the GAME LAB index">← 回到 GAME LAB 首页</span></a>
      <a href="./#games"><span data-zh="咒 · 怨宅 / 强渡火星 / 植物大战僵尸 …" data-en="Cursed House / Forcing Mars / Plants vs Zombies …">咒 · 怨宅 / 强渡火星 / 植物大战僵尸 …</span></a>
      <a href="./persona/"><span data-zh="像素舞台剧 · 十一部" data-en="Eleven pixel stage plays">像素舞台剧 · 十一部</span></a>
    </div>
  </header>

</div>
<script src="./assets/i18n.js"></script>
</body>
