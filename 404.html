<!doctype html>
<html lang="zh-CN"
      data-title-zh="404 — GAME LAB"
      data-title-en="404 — GAME LAB"
      data-desc-zh="这个地址下没有东西。"
      data-desc-en="Nothing lives at this address.">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — GAME LAB</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="180x180" href="./assets/favicon-180.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon-180.png" />
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<!-- 主题在样式生效前定好，避免刷新时闪一下白/黑 -->
<script>
(function () {
  var d = document.documentElement;
  d.classList.add("js");
  try {
    var t = localStorage.getItem("gl-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    d.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="./assets/index.css" />
<style>
  .lost .row, .lost .toc { display: none; }
  .lost-list { margin-top: 30px; display: flex; flex-direction: column; gap: 2px; }
  .lost-list a { font-family: var(--serif); font-size: 20px; color: var(--ink-2); text-decoration: none; padding: 10px 14px; border-bottom: 1px solid var(--line); border-radius: 14px; transition: color .4s var(--ease), padding-left .5s var(--ease), background .5s var(--ease), box-shadow .5s var(--ease); }
  .lost-list a:hover {
    color: var(--ink); padding-left: 24px;
    position: relative; isolation: isolate;
    background: var(--glass-bg); border: 1px solid var(--glass-edge); box-shadow: var(--glass-sm);
    border-bottom-color: transparent;
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  }
  .lost-list a:hover::before, .lost-list a:hover::after {
    content: ""; position: absolute; z-index: -1; pointer-events: none; border-radius: inherit;
  }
  .lost-list a:hover::before {
    top: 34%; left: 8px; right: 8px; bottom: -6%;
    border: 1px solid var(--glass-refract); filter: blur(8px);
  }
  .lost-list a:hover::after {
    inset: 0;
    background: linear-gradient(45deg, var(--glass-sheen) 0%, transparent 26%, transparent 74%, var(--glass-sheen) 100%);
    filter: blur(3px);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div><a href="./" style="color:inherit;text-decoration:none">GAME LAB</a> / 404</div>
    <div style="display:flex;align-items:center;gap:20px">
      <a href="https://github.com/XanthanL/game-lab" target="_blank" rel="noopener">GitHub</a>
      <button id="langToggle" class="lang-toggle glass" type="button">EN</button>
    </div>
  </div>

  <header class="hero lost">
    <div class="eyebrow"><span data-zh="这里什么都没有" data-en="Nothing here">这里什么都没有</span></div>
    <h1 style="font-size:clamp(70px,18vw,190px)">4<span class="i">·</span>4</h1>
    <p class="lede" style="max-width:44ch">
      <span data-zh="这个地址下没有作品——可能它换了目录，也可能从来就没有过。下面是几个一定在的地方。"
            data-en="No work lives at this address — it either moved or never existed. Here are some places that are definitely real."></span>
    </p>
    <div class="lost-list">
      <a href="./"><span data-zh="← 回到 GAME LAB 首页" data-en="← Back to the GAME LAB index">← 回到 GAME LAB 首页</span></a>
      <a href="./#games"><span data-zh="咒 · 怨宅 / 强渡火星 / 植物大战僵尸 …" data-en="Cursed House / Forcing Mars / Plants vs Zombies …">咒 · 怨宅 / 强渡火星 / 植物大战僵尸 …</span></a>
      <a href="./persona/"><span data-zh="像素舞台剧 · 十一部" data-en="Eleven pixel stage plays">像素舞台剧 · 十一部</span></a>
    </div>

</div>

</html>
