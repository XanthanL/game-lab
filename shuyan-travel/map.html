<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行地图 - 树言·旅记</title>
    <meta name="description" content="53处足迹：八年乘车的虚线，和一条从雨崩徒步到鹤岗、斜穿整张版图的对角线。在交互式地图上看清整条行走的轨迹。">
    <meta name="theme-color" content="#FFF8E1">
    <link rel="canonical" href="https://xanthanl.github.io/game-lab/shuyan-travel/map.html">
    
    <!-- Favicon / 网页图标 -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">
    
    <!-- Open Graph / 微信分享元数据 -->
    <meta property="og:title" content="旅行地图 - 树言·旅记">
    <meta property="og:description" content="这是我用双脚在大地上写下的诗。53处足迹，一条从雨崩斜穿版图、终点落在鹤岗的徒步对角线——两年零一个月，画完了。">
    <meta property="og:image" content="https://xanthanl.github.io/game-lab/shuyan-travel/assets/android-chrome-512x512.png">
    <meta property="og:url" content="https://xanthanl.github.io/game-lab/shuyan-travel/map.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="树言·旅记">
    
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet（自托管）：unpkg 在移动网络下经常超时，导致手机端地图整体空白 -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <!-- defer 避免阻塞首次渲染，与页尾同样 defer 的 map.js 按文档顺序执行 -->
    <script src="vendor/leaflet/leaflet.js" defer></script>
    <style>
        .map-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }
        
        .map-title {
            font-size: 2.5rem;
            font-weight: normal;
            color: var(--color-dark-earth);
            margin-bottom: var(--space-sm);
        }
        
        .map-description {
            font-size: 1.1rem;
            color: var(--color-earth);
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 地图页面布局：突破正文窄容器，用横向宽幅画布展开整张版图 */
        .map-layout {
            --map-w: min(1500px, calc(100vw - 48px));
            display: flex;
            width: var(--map-w);
            margin-left: calc((100% - var(--map-w)) / 2);
            height: clamp(520px, 72vh, 780px);
            background: var(--color-paper);
            border: 1px solid var(--color-border);
            overflow: hidden;
            margin-bottom: var(--space-xl);
        }

        .map-sidebar {
            width: 320px;
            flex-shrink: 0;
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            background-color: rgba(139, 115, 85, 0.02);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--color-earth);
        }

        .show-all-btn {
            background: none;
            border: 1px solid var(--color-earth);
            color: var(--color-earth);
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .show-all-btn:hover {
            background: var(--color-earth);
            color: white;
        }

        .location-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .map-main {
            flex: 1;
            position: relative;
        }

        #travel-map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* 侧栏分段标题 */
        .location-group-title {
            position: sticky;
            top: -15px;
            z-index: 5;
            margin: 10px -15px 0;
            padding: 8px 20px;
            background: var(--color-paper);
            border-top: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
            font-family: var(--font-sans);
            font-size: 0.78rem;
            letter-spacing: 0.15em;
            color: var(--color-earth);
        }

        .location-group-title:first-child {
            margin-top: -15px;
            border-top: none;
        }

        /* 列表项：47 项后收紧间距 */
        .location-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--color-border);
            cursor: pointer;
            transition: all 0.3s;
        }

        .location-item:hover {
            background: rgba(139, 115, 85, 0.05);
        }

        .location-item.active {
            border-left: 3px solid var(--color-dark-earth);
            background: rgba(139, 115, 85, 0.08);
        }

        .location-item-name {
            display: block;
            font-weight: bold;
            color: var(--color-dark-earth);
            font-size: 1.05rem;
            margin-bottom: 3px;
        }

        .location-item-date {
            font-size: 0.8rem;
            color: var(--color-earth);
            font-family: var(--font-sans);
            display: block;
            margin-bottom: 6px;
        }

        .location-item-desc {
            font-size: 0.88rem;
            color: var(--color-ink);
            line-height: 1.5;
            opacity: 0.85;
        }

        /* 徒步轨迹：沿线流动的脚步虚线 */
        .walk-flow {
            stroke-dasharray: 2 10;
            stroke-linecap: round;
            animation: walk-dash 1.4s linear infinite;
        }

        @keyframes walk-dash {
            to { stroke-dashoffset: -12; }
        }

        /* 当前位置脉冲标记 */
        .here-marker { pointer-events: none; }

        .here-pulse {
            position: absolute;
            top: 0; left: 0;
            width: 14px; height: 14px;
            border-radius: 50%;
        }

        .here-pulse::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(191, 54, 12, 0.6);
            animation: here-ripple 1.8s ease-out infinite;
        }

        .here-pulse::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(191, 54, 12, 0.4);
            animation: here-ripple 1.8s ease-out 0.6s infinite;
        }

        @keyframes here-ripple {
            0%   { transform: scale(0.4); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .here-label {
            position: absolute;
            top: -4px;
            left: 22px;
            white-space: nowrap;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            color: #BF360C;
            background: rgba(255, 248, 225, 0.9);
            border: 1px solid rgba(191, 54, 12, 0.35);
            border-radius: 3px;
            padding: 2px 8px;
            letter-spacing: 0.1em;
        }

        /* 图例 */
        .map-legend {
            background: rgba(255, 248, 225, 0.92);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 10px 14px;
            font-family: var(--font-sans);
            font-size: 0.78rem;
            color: var(--color-ink);
            line-height: 2;
        }

        .legend-line {
            display: inline-block;
            width: 28px;
            height: 0;
            margin-right: 8px;
            vertical-align: middle;
        }

        .legend-dashed { border-top: 2px dashed #795548; opacity: 0.6; }
        .legend-solid { border-top: 3px solid #BF360C; }

        .legend-dot {
            display: inline-block;
            width: 10px; height: 10px;
            margin: 0 17px 0 9px;
            border-radius: 50%;
            background: #BF360C;
            vertical-align: middle;
            box-shadow: 0 0 0 3px rgba(191, 54, 12, 0.25);
        }

        .travel-stats-simple {
            display: flex;
            justify-content: center;
            gap: 80px;
            padding: var(--space-xl) 0;
            border-top: 1px solid var(--color-border);
        }

        .stat-box {
            font-size: 1.1rem;
            color: var(--color-earth);
        }

        .stat-box strong {
            font-size: 2.2rem;
            color: var(--color-dark-earth);
            margin-right: 8px;
            font-weight: normal;
        }

        @media (max-width: 900px) {
            .map-title { font-size: 1.8rem; }
            .map-description { font-size: 0.95rem; padding: 0 var(--space-md); }
            .map-layout { flex-direction: column-reverse; height: auto; min-height: 0; --map-w: calc(100vw - 24px); }
            .map-sidebar { width: 100%; height: 300px; border-right: none; border-top: 1px solid var(--color-border); }
            /* svh 避免手机地址栏收放时地图高度跳动 */
            .map-main { height: 62vh; height: 62svh; min-height: 380px; }
            .here-label { display: none; }
            .sidebar-header { padding: 12px 16px; }
            .location-item { padding: 11px 14px; }
            .location-item-name { font-size: 0.98rem; }
            .location-item-desc { font-size: 0.82rem; }
            /* 小屏图例收紧，不盖住半张地图 */
            .map-legend { font-size: 0.68rem; line-height: 1.8; padding: 6px 10px; }
            .legend-line { width: 20px; margin-right: 6px; }
            .legend-dot { margin: 0 11px 0 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1 class="site-title">树言·旅记</h1>
        </header>
        
        <nav class="site-nav">
            <a href="index.html" class="nav-link">时间线</a>
            <a href="map.html" class="nav-link active">旅行地图</a>
            <a href="about.html" class="nav-link">关于树言</a>
        </nav>
        
        <main class="main-content">
            <div class="map-header">
                <h2 class="map-title">旅行足迹</h2>
                <p class="map-description">这是我用双脚在大地上写下的诗。淡虚线是八年里坐车走过的路；深色实线是从雨崩起笔、鹤岗收笔的徒步对角线——两年零一个月，斜穿整张版图。</p>
            </div>
            
            <div class="map-layout">
                <aside class="map-sidebar">
                    <div class="sidebar-header">
                        <span id="location-count">正在读取记录...</span>
                        <button class="show-all-btn" onclick="showAllLocations()">轨迹全览</button>
                    </div>
                    <div class="location-list-container" id="location-list"></div>
                </aside>

                <div class="map-main">
                    <div id="travel-map"></div>
                </div>
            </div>
        </main>
        
        <footer class="site-footer">
            <p>© 2018-2027 树言·旅记 | 记录每一次出发</p>
        </footer>
    </div>
    
    <script src="js/stories.js" defer></script>
    <script src="js/stories-walk.js" defer></script>
    <script src="js/map.js" defer></script>
</body>
</html>
