  #stage-wrap{ display:flex; flex-direction:column; align-items:center; }

  /* ===== DS 外壳 ===== */
  #ds-shell{
    position:relative;
    width:824px;               /* 768 屏幕 + 边框 */
    padding:18px 18px 26px;
    background:linear-gradient(160deg,#2e3138,#191a20 55%,#101116);

  }
  /* 上屏 / 下屏插槽 */
  .slot{
    position:relative;
    width:768px; height:576px;              /* 256×192 × 3 */
    background:#000;
    border:8px solid var(--bezel);
    border-radius:10px;
    overflow:hidden;
  }
  .slot canvas{
    display:block;
    width:768px; height:576px;
    image-rendering:pixelated; image-rendering:crisp-edges;
    cursor:pointer;
  }
  /* CRT 扫描线 */
  .slot::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  /* 屏幕玻璃反光 */
  .slot::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
    background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,transparent 26%,transparent 72%,rgba(255,255,255,.05) 100%);
  }
  .hinge{ height:16px; margin:6px 0; background:linear-gradient(#0c0d11,#17181d); border-radius:6px; box-shadow:inset 0 2px 4px #000; }
  /* 电源灯 */
  .power{
    position:absolute; top:16px; right:38px; width:8px; height:8px; border-radius:50%;
    background:#3f8f4a; box-shadow:0 0 8px #3f8f4a; animation:led 3.2s infinite;
  }
  @keyframes led{ 0%,92%,100%{opacity:1} 94%{opacity:.25} 96%{opacity:1} }
  /* 底部：商标 + 十字键 + AB键（纯装饰） */
  .shell-foot{
    margin-top:14px; display:flex; align-items:center; justify-content:space-between;

  .dpad{ display:grid; grid-template-columns:repeat(3,20px); grid-template-rows:repeat(3,20px); gap:2px; }

function def(name,rows){
  const h=rows.length, w=rows[0].length;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const x=cv.getContext('2d');
  for(let iy=0;iy<h;iy++)for(let ix=0;ix<w;ix++){
    const ch=rows[iy][ix];
    if(ch==='.')continue;
    x.fillStyle=PAL[ch]||'#f0f'; x.fillRect(ix,iy,1,1);
  }
  SPR[name]={cv,w,h};
}
function drawSpr(ctx,name,x,y,sc=1,flip=false){
  const s=SPR[name]; if(!s)return;
  ctx.save();
  ctx.translate(Math.round(x),Math.round(y));
  if(flip){ ctx.scale(-1,1); ctx.translate(-s.w,0); }
  if(sc!==1) ctx.scale(sc,sc);
  ctx.drawImage(s.cv,0,0);
  ctx.restore();
}

/* ─────────── 音频（WebAudio 芯片音） ─────────── */
let AC=null, master=null;
function actx(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain(); master.gain.value=0.8; master.connect(AC.destination); }
    if(AC.state==='suspended') AC.resume();
  }catch(e){}
  return AC;
}
function tone(freq,dur,type,vol,when){
  try{
    if(!AC)return;
    const t0=AC.currentTime+(when||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.05),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function noiseBurst(dur,vol,when,hp){
  try{
    if(!AC)return;
    const t0=AC.currentTime+(when||0);
    const n=Math.floor(AC.sampleRate*dur);
    const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1;
      if(hp){ w=w*0.55+last*0.45; last=w; }
      d[i]=w*(1-i/n); }
    const src=AC.createBufferSource(); src.buffer=buf;
    const g=AC.createGain();
    g.gain.setValueAtTime(vol||0.1,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(g); g.connect(master);
    src.start(t0);
  }catch(e){}
}

const music={
  name:null, beat:0, ni:0, timer:null,
  set(n){
    if(this.name===n) return;
    this.name=n; this.beat=0; this.ni=0;
    if(!this.timer) this.timer=setInterval(()=>this.pump(),180);
  },
  pump(){
    const tr=TRACKS[this.name];
    if(!tr||!AC) return;
    const bd=60/tr.bpm;
    let guard=0;
    while(guard++<32){
      const nt=tr.notes[this.ni];
      let d=nt[1]-this.beat;
      if(d<0) d+=tr.len;
      if(d>0.62/bd) break;
      tone(nt[0],Math.max(0.08,nt[2]*bd*0.9),nt[3]||'sine',(nt[4]||0.05)*0.9,d*bd+0.03);
      this.ni=(this.ni+1)%tr.notes.length;
    }
    this.beat+=0.18/bd;
    if(this.beat>=tr.len) this.beat-=tr.len;
  }
};

/* ─────────── 三体问题 N体模拟（三体世界的天空） ─────────── */
const SIM={bodies:null, trail:[[],[],[]]};
function simReset(){
  SIM.bodies=[
    {x:118,y:62,vx:0.7, vy:0.15,m:1.0, r:10,c:'#ffd878'},
    {x:150,y:104,vx:-0.55,vy:-0.25,m:0.95,r:8, c:'#ff9a4a'},
    {x:96, y:110,vx:-0.15,vy:-0.6, m:1.05,r:12,c:'#c8e8f8'}
  ];
  SIM.trail=[[],[],[]];
}
function simStep(dt){
  const b=SIM.bodies, G=50, n=4;
  for(let s=0;s<n;s++){
    for(const p of b){
      let ax=0, ay=0;
      for(const q of b){
        if(q===p) continue;
        const dx=q.x-p.x, dy=q.y-p.y;
        const d2=dx*dx+dy*dy+40;
        const d=Math.sqrt(d2), f=G*q.m/d2;
        ax+=dx/d*f; ay+=dy/d*f;
      }
      ax+=(128-p.x)*0.00012; ay+=(96-p.y)*0.0001;
      p.vx+=ax*dt/n; p.vy+=ay*dt/n;
    }
    for(const p of b){ p.x+=p.vx*dt/n; p.y+=p.vy*dt/n; }
  }
  for(let i=0;i<3;i++){
    SIM.trail[i].push({x:b[i].x,y:b[i].y});
    if(SIM.trail[i].length>46) SIM.trail[i].shift();
  }
}
function simTemp(){
  const b=SIM.bodies;
  let dmin=1e9;
  for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){
    const d=Math.hypot(b[i].x-b[j].x,b[i].y-b[j].y);
    if(d<dmin) dmin=d;
  }
  return clamp(1-(dmin-46)/100,0,1);
}
function drawSun(ctx,x,y,r,color){
  const layers=[[r*3.2,.05],[r*2.1,.1],[r*1.45,.2],[r,1]];
  for(const [rr,a] of layers){
    ctx.globalAlpha=a; ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle=color;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    ctx.fillRect(x+Math.cos(a)*r-1,y+Math.sin(a)*r-1,2,2);
  }
}
function drawSim(ctx,st){
  for(let i=0;i<3;i++){
    const tr=SIM.trail[i];
    for(let j=0;j<tr.length;j++){
      ctx.globalAlpha=j/tr.length*0.5;
      ctx.fillStyle=SIM.bodies[i].c;
      ctx.fillRect(tr[j].x|0,tr[j].y|0,1,1);
    }
  }
  ctx.globalAlpha=1;
  for(const p of SIM.bodies){
    let y=p.y;
    if(st.actBg==='trisolaris' && fxT('sunrise')>=0){
      if(p.c==='#c8e8f8') y=lerp(y,150,Math.min(1,fxT('sunrise')/4));
    }
    drawSun(ctx,p.x,y,p.r,p.c);
  }
}

/* ─────────── 粒子 ─────────── */
function spawn(x,y,vx,vy,life,color,size,type){
  st.par.push({x,y,vx,vy,life,max:life,color,size,type});
}
function partUpdate(dt){
  for(let i=st.par.length-1;i>=0;i--){
    const p=st.par[i];
    p.life-=dt;
    if(p.life<=0){ st.par.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=1-1.6*dt; p.vy*=1-1.6*dt;
    if(p.type==='fire'||p.type==='spark') p.vy-=40*dt;
  }
}
function partDraw(ctx){
  for(const p of st.par){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    const s=p.size||2;
    ctx.fillRect(p.x|0,p.y|0,s,s);
  }
  ctx.globalAlpha=1;
}

/* ─────────── 通用背景 ─────────── */
function bgNight(ctx,t,top,bottom){
  const g=ctx.createLinearGradient(0,0,0,192);
  g.addColorStop(0,top||'#0a0e1c'); g.addColorStop(0.6,bottom||'#101830'); g.addColorStop(1,'#1c2440');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function starfield(ctx,t,amt,alpha){
  for(let i=0;i<(amt||60);i++){
    const sx=((i*137.5)%W), sy=((i*89.7)%170)+2;
    const tw=0.35+0.65*Math.abs(Math.sin(t*0.0012+i*1.7));
    ctx.globalAlpha=tw*Math.min(1,alpha||1)*0.8;
    ctx.fillStyle='#fff';
    ctx.fillRect(sx|0,sy|0,1,1);
  }
  ctx.globalAlpha=1;
}
function mountains(ctx,base,color){
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(0,192);
  for(let x=0;x<=256;x+=16){
    const y=base-(((x*37)%90)+14);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(256,192); ctx.fill();
}

function startAct(i){

function nextCue(){
  st.cue++; st.cueTime=0;

  if(!c) return; // 幕末，由 update 处理转幕
  if(c.t==='line') st.typing={text:c.text,chars:0,lastTick:0,done:false};
  else if(c.t==='fx'){ fxStart(c.fx); }
  else if(c.t==='bg'){ st.actBg=c.bg; music.set(c.bg); }

    simStep(dt*0.5);

    if(!st.paused) st.credT+=dt;

    st.cueTime+=dt;
    if(c.t==='line'){
      const tp=st.typing;
      if(!tp.done){
        tp.chars+=dt*26;
        if(tp.chars>=tp.lastTick+2){ tp.lastTick=Math.floor(tp.chars); SFX.tick(); }
        if(tp.chars>tp.text.length){ tp.chars=tp.text.length; tp.done=true; SFX.blip(); }

    }

    if(p){ p.state='rise'; p.t0=st.actTime; }
  }
  // 古筝：审判日号航行
  const sp=st.fx['ship'];
  if(sp) st.shipX=Math.min(84,-60+fxT('ship')*18);
  // 乱纪元火焰粒子（限速生成）
  const ht=st.fx['heat'];
  if(ht && ht.last===0 && fxT('heat')>0.4){ ht.last=1; SFX.fire(); }
  if(ht){
    const target=Math.floor(fxT('heat')*16);
    while((ht.n||0)<target){
      ht.n=(ht.n||0)+1;
      spawn((ht.n*31)%256,148,0,-rand(16,44),rand(0.5,1.1),'#ff9a3a',rand(1,3),'fire');
    }
  }
  // 自然选择号引擎焰（限速生成）
  const es=st.fx['escape'];
  if(es){
    const target=Math.floor(fxT('escape')*26);
    const p=clamp(fxT('escape')/5,0,1);
    while((es.n||0)<target){
      es.n=(es.n||0)+1;
      spawn(-20+p*p*1.5*296+24,124+rand(-3,3),rand(30,70),0,rand(0.25,0.6),'#7cc8f0',rand(1,2),'spark');
    }
  }
  const th=st.fx['threat'];
  if(th && th.last===0){ th.last=1; SFX.glitch(); }
  const dc=st.fx['curtain'];
  if(dc && dc.last===0 && fxT('curtain')>0.1){ dc.last=1; SFX.confirm(); }
}
function explodeFleet(i){
  const x=26+(i%7)*32, y=44+Math.floor(i/7)*26;
  for(let k=0;k<26;k++){
    const a=rand(0,Math.PI*2), sp=rand(12,54);

}

/* ─────────── 上屏：舞台渲染 ─────────── */
function renderTop(){
  const ctx=cTop;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(st.shake>0) ctx.translate(rand(-st.shake,st.shake)|0,rand(-st.shake,st.shake)|0);
  if(st.mode==='boot') rBoot(ctx);
  else if(st.mode==='title') rTitle(ctx);
  else if(st.mode==='credits') rCredits(ctx);
  else{
    const R={
      redcoast:rRedcoast, listening:rListening, game:rGame, trisolaris:rTrisolaris,
      guzheng:rGuzheng, droplet:rDroplet, darkforest:rDarkforest, sunset:rSunset
    };
    const f=R[st.actBg]||rRedcoast;
    f(ctx);
    // 幕间卡片
    if(st.card){
      const t=st.actTime-st.card.t0;
      let a=0;
      if(t<0.5) a=t/0.5; else if(t<1.7) a=1; else a=Math.max(0,1-(t-1.7)/0.6);
      if(a>0){
        ctx.globalAlpha=a;
        ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,256,192);
        text(ctx,st.card.name,128,74,20,'#ffd8a0','center',true);
        text(ctx,st.card.sub,128,102,10,'#8890a0','center');
        ctx.globalAlpha=1;
      }
    }
  }
  // 幕布（终幕关闭，仅演出时）
  const cur=st.fx['curtain'];
  if(cur && st.mode==='play'){
    const p=clamp(fxT('curtain')/2.6,0,1);
    if(p>0){
      const w=128*p;
      ctx.fillStyle='#7a1a1a';
      ctx.fillRect(0,0,w,192); ctx.fillRect(256-w,0,w,192);
      ctx.fillStyle='#8f2222';
      for(let i=0;i<10;i++){
        const wx=((i+0.5)*128*p/10)|0;
        ctx.fillRect(wx-1,0,2,192); ctx.fillRect(256-wx-1,0,2,192);
      }
    }
  }
  // 泛光暗角
  const vg=ctx.createRadialGradient(128,96,70,128,96,170);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* —— 第二幕：三体世界 —— */
function rTrisolaris(ctx){
  const t=st.actTime;
  bgNight(ctx,t,'#0c0a18','#141028');
  starfield(ctx,t,40,0.6);
  drawSim(ctx,st);
  // 乱纪元 / 恒纪元 温度色调
  const tmp=simTemp();
  if(tmp>0.55){
    ctx.fillStyle='rgba(255,130,30,'+(tmp-0.55)*0.55+')';
    ctx.fillRect(0,0,W,H);
  }else if(tmp<0.3){
    ctx.fillStyle='rgba(90,140,230,'+(0.3-tmp)*0.4+')';
    ctx.fillRect(0,0,W,H);
  }
  // 火焰（heat fx，粒子由 update 限速生成）
  const ht=st.fx['heat'];
  if(ht && fxT('heat')<8){
    const p=clamp(fxT('heat')/3,0,1);
    ctx.fillStyle='rgba(255,110,20,'+p*0.35+')';
    ctx.fillRect(0,0,W,H);
  }
  // 地面
  ctx.fillStyle='#3a2418'; ctx.fillRect(0,150,256,42);
  ctx.fillStyle='#2a1a10';
  for(let i=0;i<40;i++) ctx.fillRect((i*57)%256,152+((i*13)%36),2,2);
  // 三体人 & 干皮
  for(const p of st.triso){
    const x=p.x;
    if(p.state==='stand'){
      drawSpr(ctx,'triso',x,148);
    }else if(p.state==='shrink'){
      const sc=Math.max(0,1-(t-p.t0)/2);
      ctx.save();
      ctx.globalAlpha=0.4+0.6*sc;
      drawSpr(ctx,'triso',x,148+(1-sc)*16,sc<0.5?0.5:1);
      ctx.restore();
      if(sc<=0){ p.state='paper'; p.t0=t; }
    }else if(p.state==='paper'){
      drawSpr(ctx,'paper',x,164);
    }else if(p.state==='rise'){
      const sc=Math.min(1,(t-p.t0)/1.6);
      ctx.save();
      ctx.globalAlpha=sc;
      drawSpr(ctx,'triso',x,148,sc<0.5?0.5:1);
      ctx.restore();
      if(sc>=1){ p.state='stand'; p.t0=t; }
    }
  }
  // 游戏 HUD
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,92,16);
  const era=tmp>0.55?'乱纪元':(tmp<0.3?'严寒纪元':'恒纪元');
  text(ctx,'三体游戏 · '+era,3,3,8,tmp>0.55?'#ff9a4a':'#7cd8d8');
  text(ctx,'文明存续：第 '+(Math.floor(t/9)+3)+' 轮',3,11,7,'#5a6a7a');
  const sr=st.fx['sunrise'];
  if(sr) text(ctx,'▲ 太阳正在坠落',176,3,8,'#ff9a4a');
}

/* 审判日号：条带切片 */
function drawJudgment(ctx,x,y,shear){
  const P=[
    [6,0,10,2,'#e8e8e0'],[10,2,8,2,'#b8b8b0'],[2,2,8,2,'#e8e8e0'],[26,2,14,2,'#e8e8e0'],

    [0,6,44,2,'#d05848'],[0,8,44,3,'#989890'],[0,11,44,2,'#3a3a42']

    ctx.fillRect(Math.round(x+px+dx),Math.round(y+py),pw,ph);

}

    const p=clamp(fxT('escape')/5,0,1);
    const x=-20+p*p*1.5*296;
    drawSpr(ctx,'ship1',x,120,1.6,false);
    text(ctx,'自然选择号',x-4,108,8,'#7cc8f0');
    if(p>0.95) st.escapeDone=true;
  }
  partDraw(ctx);
  if(sl){
    // 状态
    const remain=st.fleetAlive;
    text(ctx,'舰队残存: '+remain,4,4,9,remain>3?'#8aa0b8':'#ff5040');
  }else{
    text(ctx,'联合舰队 · 2000 艘',4,4,9,'#8aa0b8');
  }
}

/* —— 第五幕：黑暗森林 —— */
function rDarkforest(ctx){
  const t=st.actTime;
  bgNight(ctx,t,'#05070e','#080b14');
  starfield(ctx,t,55,0.8);
  // 树列
  drawSpr(ctx,'tree',20,158,1.5);
  drawSpr(ctx,'tree',70,162,1.8);
  drawSpr(ctx,'tree',212,158,1.5);
  drawSpr(ctx,'tree',236,163,1.9,true);
  drawSpr(ctx,'tree',180,166,2.1);
  ctx.fillStyle='#0a0c12'; ctx.fillRect(0,174,256,18);
  // 雾（forest fx）
  const fs=st.fx['forest'];
  if(fs && fxT('forest')<10){
    for(let k=0;k<3;k++){
      const x=((t*6+k*90)%300)-20;
      ctx.fillStyle='rgba(140,150,170,0.06)';
      ctx.fillRect(x,150,120,26);
    }
  }
  // 墓碑 + 罗辑
  drawSpr(ctx,'grave',104,162);
  drawSpr(ctx,'fig',140,166);
  // 威胁（三体巨面）
  const th=st.fx['threat'];
  if(th && fxT('threat')<7){
    ctx.fillStyle='rgba(200,30,20,'+(0.2+0.1*Math.sin(t*0.02))+')';
    ctx.fillRect(0,0,256,192);
    drawSun(ctx,128,78,40,'#c02018');
    drawSpr(ctx,'hd_triso',103,54,5);
    // 故障条
    for(let i=0;i<14;i++){
      const sx=(i*41)%256;
      ctx.fillStyle='rgba(255,60,40,'+rand(0.1,0.3)+')';
      ctx.fillRect(sx,0,1,192);
    }
    text(ctx,'你们是虫子！',128,132,20,'#ff4030','center',true);
  }
  // 蝗群
  const lc=st.fx['locust'];
  if(lc && fxT('locust')<12){
    const p=clamp(fxT('locust')/3,0,1);
    const fade=clamp(1-(fxT('locust')-7)/3,0,1);
    const n=Math.floor(44*p);
    for(let i=0;i<n;i++){
      const x=((i*57+t*(10+(i%4)*4))%280)-12;
      const y=20+((i*31)%120)+Math.sin(t*0.01+i)*8;
      ctx.globalAlpha=fade;
      drawSpr(ctx,i%2?'loc_a':'loc_b',x|0,y|0,i%2?0.8:1.1,((i/2)|0)%2===0);
    }
    ctx.globalAlpha=1;
  }
}
/* 落日 */
function rSunset(ctx){
  const t=st.actTime;
  const g=ctx.createLinearGradient(0,0,0,192);
  g.addColorStop(0,'#2a0c0c'); g.addColorStop(0.6,'#8a3a1a'); g.addColorStop(1,'#d8782a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawSun(ctx,128,136,17,'#ffe8a0');
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,150,256,42);
  drawSpr(ctx,'fig',150,162);
  // 飞鸟
  ctx.strokeStyle='#1a0a0a';
  for(let i=0;i<3;i++){
    const bx=60+i*38+Math.sin(t*0.001+i)*6, by=40+i*14;
    ctx.beginPath();
    ctx.moveTo(bx-4,by); ctx.lineTo(bx,by-2); ctx.lineTo(bx+4,by);
    ctx.stroke();
  }
}

/* —— 谢幕 —— */
function rCredits(ctx){

}

/* ─────────── 下屏：剧本 / 触控 ─────────── */
function renderBot(){
  st.btns=[];
  if(st.mode==='boot') return; // 下屏开机画面由 rBoot 绘制
  const ctx=cBot;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0b10'; ctx.fillRect(0,0,W,H);
  if(st.mode==='title')        rTitleBot(ctx);
  else if(st.mode==='credits') rCreditsBot(ctx);
  else                         rPlayHud(ctx);
  // 覆盖层（标题/演出通用）
  if(st.overlay==='menu')      rMenu(ctx);
  else if(st.overlay==='acts') rActs(ctx);
  else if(st.overlay==='script') rScript(ctx);
  else if(st.overlay==='full') rFullScript(ctx);
  else if(st.overlay==='info') rInfo(ctx);
  else if(st.overlay==='vol')  rVol(ctx);
  else if(st.mode==='play')    drawDialogue(ctx);
}
function btn(ctx,x,y,w,h,label,id,color){
  ctx.fillStyle='#1c2028'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#4a5260'; ctx.strokeRect(x,y,w,h);
  text(ctx,label,x+w/2,y+(h-10)/2,10,color||'#c8d0d8','center');
  st.btns.push({x,y,w,h,id});
}
function rTitleBot(ctx){

function rPlayHud(ctx){
  const a=PLAY.acts[st.act];
  if(!a) return;
  text(ctx,'第'+(st.act+1)+'幕 · '+a.name,8,5,10,'#98a0a8');
  const n=a.script.length;
  text(ctx,st.cue+1+'/'+n,160,5,10,'#707880');
  ctx.fillStyle='#262a34'; ctx.fillRect(8,19,240,3);
  ctx.fillStyle='#7c90b8'; ctx.fillRect(8,19,240*clamp((st.cue+1)/n,0,1),3);

  btn(ctx,176,4,20,14,st.paused?'▶':'⏸','pause','#c8d0d8');
  btn(ctx,198,4,36,14,'剧本','script','#c8d0d8');
  btn(ctx,236,4,16,14,'≡','menu','#c8d0d8');
}
function drawDialogue(ctx){
  const c=cue();
  if(!c) return;
  if(c.t==='line'){
    const who=c.who||'?';
    ctx.fillStyle='rgba(4,5,10,0.85)';
    ctx.fillRect(4,100,248,88);
    ctx.strokeStyle='#565e6c'; ctx.strokeRect(4,100,248,88);
    // 头像
    ctx.fillStyle='#14141c'; ctx.fillRect(10,108,30,30);
    ctx.strokeStyle='#2a2e3a'; ctx.strokeRect(10,108,30,30);
    drawSpr(ctx,PORT[who]||'hd_luoji',12,110,2);
    text(ctx,who,46,107,12,SPEAKER_COL[who]||'#f0e8d0',null,true);
    // 打字机
    const lines=wrap(c.text,17);
    let remain=st.typing.chars, yi=126;
    for(const ln of lines){
      if(remain<=0) break;
      const take=Math.min(remain,ln.length);
      text(ctx,ln.slice(0,take),46,yi,12,'#e8e8e4');
      remain-=take; yi+=15;
    }
    if(st.typing.done) text(ctx,'▽ 触屏 / 空格',210,180,8,'#787878');
  }else if(c.t==='nar'){
    ctx.fillStyle='rgba(4,5,10,0.62)';
    ctx.fillRect(16,118,224,48);
    ctx.strokeStyle='#2a303c'; ctx.strokeRect(16,118,224,48);
    text(ctx,'── ◆ 旁白 ◆ ──',128,112,9,'#8898a8','center');
    const ls=wrap(c.text,17).slice(0,2);
    ls.forEach((ln,i)=>text(ctx,ln,128,130+i*16,12,'#c8d0d8','center'));
    text(ctx,'▽ 触屏 / 空格',210,180,8,'#787878');
  }else if(c.t==='fx'){
    const lb=FXLABEL[c.fx];
    if(lb){
      ctx.fillStyle='rgba(4,5,10,0.5)';
      ctx.fillRect(48,128,160,24);
      text(ctx,lb,128,134,11,'#90a0b0','center');
    }
  }
}

  btn(ctx,48,58,160,22,'剧本（当前幕）','script','#c8d0d8');

function rActs(ctx){

  text(ctx,'— 幕次选择 —',128,6,11,'#98a0a8','center');

function rScript(ctx){
  const a=PLAY.acts[st.act];
  if(!a) return;
  ctx.fillStyle='rgba(4,5,10,0.92)'; ctx.fillRect(0,0,256,192);
  text(ctx,'剧本 · '+a.name,8,4,10,'#98a0a8');
  btn(ctx,208,2,44,14,'返回','back','#98a0a8');
  const pg=st.scriptPage, per=11;
  for(let i=0;i<per;i++){
    const idx=pg*per+i;
    if(idx>=a.script.length) break;
    const c=a.script[idx];
    const y=20+i*13;
    const prefix=c.t==='line'?(c.who+': '):(c.t==='nar'?'◆ ':'□ ');
    const col=c.t==='line'?(SPEAKER_COL[c.who]||'#e8e8e0'):'#8898a8';
    if(idx===st.cue) ctx.fillStyle='rgba(255,216,120,0.12)';
    else ctx.fillStyle='transparent';
    ctx.fillRect(4,y-1,248,12);
    text(ctx,(idx+1)+' '+prefix+wrap(c.text||'',15)[0],8,y,9,col);
    st.btns.push({x:0,y,w:256,h:13,id:'line:'+idx});
  }
  const pages=Math.ceil(a.script.length/per);
  text(ctx,'页 '+(pg+1)+' / '+pages,8,178,9,'#566070');
  btn(ctx,220,174,30,14,'▼','pg+','#98a0a8');
  if(pg>0) btn(ctx,188,174,30,14,'▲','pg-','#98a0a8');
}
function rFullScript(ctx){
  ctx.fillStyle='rgba(4,5,10,0.93)'; ctx.fillRect(0,0,256,192);
  text(ctx,'全剧剧本',8,4,10,'#98a0a8');
  btn(ctx,208,2,44,14,'返回','back','#98a0a8');
  // 展平
  const lines=[];
  PLAY.acts.forEach((a,ai)=>{
    lines.push({t:'h',txt:'— 第'+(ai+1)+'幕 · '+a.name+' —'});
    a.script.forEach((c,ci)=>lines.push({t:'c',txt:(c.t==='line'?(c.who+': '):(c.t==='nar'?'◆ ':'□ '))+c.text,act:ai,ci}));
  });
  const pg=st.fullPage, per=10;
  for(let i=0;i<per;i++){
    const idx=pg*per+i;
    if(idx>=lines.length) break;
    const l=lines[idx];
    const y=18+i*14;
    if(l.t==='h'){ text(ctx,l.txt,128,y,10,'#ffd878','center',true); }
    else{
      text(ctx,wrap(l.txt,23)[0],6,y,9,'#b8c0c8');
      st.btns.push({x:0,y,w:256,h:14,id:'gline:'+l.act+':'+l.ci});
    }
  }
  const pages=Math.ceil(lines.length/per);
  text(ctx,'页 '+(pg+1)+' / '+pages,8,178,9,'#566070');
  btn(ctx,220,174,30,14,'▼','fpg+','#98a0a8');

}
function rInfo(ctx){
  ctx.fillStyle='rgba(4,5,10,0.92)'; ctx.fillRect(0,0,256,192);
  const L=['《三体 · 地球往事》','NDS 双屏像素舞台剧','',
    '原作 · 刘慈欣《三体》','剧本 · 前端内嵌脚本数据','演出 · Canvas 舞台引擎',
    '音乐 · WebAudio 芯片音序','三体问题 · N体数值模拟','',

}
function rVol(ctx){
  ctx.fillStyle='rgba(4,5,10,0.9)'; ctx.fillRect(0,0,256,192);
  text(ctx,'声音设置',128,36,13,'#c8d0d8','center',true);
  ctx.fillStyle='#262a34'; ctx.fillRect(48,68,160,10);
  ctx.fillStyle='#7cd8d8'; ctx.fillRect(48,68,160*st.vol,10);
  btn(ctx,48,90,50,20,'− 减','v-','#c8d0d8');
  btn(ctx,158,90,50,20,'＋ 加','v+','#c8d0d8');
  btn(ctx,88,120,80,20,'确定','resume','#ffd878');
}
/* 按钮命中 */
function doBtn(id){
  actx();
  if(id==='start'){ startPlay(); return; }
  if(id==='pause'){ st.paused=!st.paused; SFX.confirm(); return; }
  if(id==='menu'){ st.overlay='menu'; SFX.confirm(); return; }
  if(id==='script'){ st.scriptPage=0; st.overlay='script'; SFX.confirm(); return; }
  if(id==='acts'||id==='acts-title'){ st.overlay='acts'; SFX.confirm(); return; }
  if(id==='full'){ st.fullPage=0; st.overlay='full'; SFX.confirm(); return; }
  if(id==='info'||id==='info-title'){ st.overlay='info'; SFX.confirm(); return; }
  if(id==='vol'){ st.overlay='vol'; SFX.confirm(); return; }
  if(id==='resume'){ st.overlay=null; SFX.confirm(); return; }
  if(id==='back'){ st.overlay=null; SFX.cancel(); return; }
  if(id==='restart'){ st.overlay=null; startPlay(); return; }
  if(id==='pg+'){ st.scriptPage++; SFX.blip(); return; }
  if(id==='pg-'){ st.scriptPage=Math.max(0,st.scriptPage-1); SFX.blip(); return; }
  if(id==='fpg+'){ st.fullPage++; SFX.blip(); return; }
  if(id==='fpg-'){ st.fullPage=Math.max(0,st.fullPage-1); SFX.blip(); return; }
  if(id==='v+'){ setVol(st.vol+0.1); return; }
  if(id==='v-'){ setVol(st.vol-0.1); return; }
  if(id.indexOf('jump:')===0){ const i=+id.slice(5); st.overlay=null; if(st.mode==='title') startPlay(); startAct(i); return; }
  if(id.indexOf('line:')===0){ jumpToCue(+id.slice(5)); return; }
  if(id.indexOf('gline:')===0){
    const p=id.split(':');
    startAct(+p[1]);
    jumpToCue(+p[2]);
    return;
  }
}
function setVol(v){
  st.vol=clamp(Math.round(v*10)/10,0,1);
  if(master) master.gain.value=st.vol*0.8;
  SFX.confirm();
}

/* ─────────── 输入 ─────────── */
function tapXY(ev,cv){
  const r=cv.getBoundingClientRect();
  const scale=r.width/W;
  return {x:(ev.clientX-r.left)/scale, y:(ev.clientY-r.top)/scale};
}
cvTop.addEventListener('pointerdown',e=>{
  const p=tapXY(e,cvTop);
  if(p.x<0||p.x>W||p.y<0||p.y>H) return;
  tapAdvance();
});
cvBot.addEventListener('pointerdown',e=>{
  const p=tapXY(e,cvBot);
  if(p.x<0||p.x>W||p.y<0||p.y>H) return;
  for(let i=st.btns.length-1;i>=0;i--){
    const b=st.btns[i];
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
      doBtn(b.id); return;
    }
  }
  // 没有按钮 → 主区域
  if(st.overlay){ st.overlay=null; return; }
  if(st.mode==='title'){ startPlay(); return; }
  tapAdvance();
});
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='Enter'){ e.preventDefault(); tapAdvance(); }
  else if(k==='p'||k==='P'){ st.paused=!st.paused; }
  else if(k==='m'||k==='M'){ st.overlay=st.overlay?'menu'===st.overlay?null:'menu':'menu'; }
  else if(k==='s'||k==='S'){ st.overlay=st.overlay==='script'?null:'script'; }
  else if(k==='Escape'){ st.overlay=null; }
  else if(/^[1-5]$/.test(k)&&st.mode==='play'){ startAct(+k-1); }
  else if(k==='r'||k==='R'){ startPlay(); }
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ─────────── 尺寸自适应 ─────────── */
function fit(){
  const shell=$('ds-shell');
  const s=Math.min(1,(window.innerWidth-30)/shell.offsetWidth,(window.innerHeight-70)/shell.offsetHeight);
  shell.style.transform='scale('+Math.max(0.3,s)+')';
}
window.addEventListener('resize',fit);
fit();

/* ─────────── 主循环 ─────────── */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  renderTop();
  renderBot();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
console.log('%c三体·像素舞台剧 %cClaude Code × deepseek-v4-flash','color:#ffd878','color:#8ab8f0');
