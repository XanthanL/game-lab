<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三体 · 像素舞台剧 — NDS 双屏版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage-bg">
  <h1 class="marquee">◆ 三 体 · 像 素 舞 台 剧 ◆</h1>

  <div class="ds" id="ds">
    <!-- ══════════ 上屏：演出画面 ══════════ -->
    <div class="ds-top">
      <div class="power"><span class="led" id="powerLed"></span>POWER</div>
      <div class="bezel">
        <div class="screen-wrap top-screen">
          <canvas id="cvTop" width="256" height="192"></canvas>
          <div class="scanlines"></div>
          <div class="top-mic"></div>
        </div>
      </div>
    </div>

    <div class="hinge"></div>

    <!-- ══════════ 下屏：触控界面 ══════════ -->
    <div class="ds-bottom">
      <div class="bezel">
        <div class="screen-wrap bottom-screen">
          <div id="uiBottom" class="ui">

            <!-- 节目单 -->
            <div id="menu" class="panel">
              <div class="menu-title">节 目 单</div>
              <div id="actList" class="act-list"></div>
              <div class="menu-btns">
                <button id="btnScript" class="ds-btn">完 整 剧 本</button>
                <button id="btnStart" class="ds-btn primary">▶ 开 始 演 出</button>
              </div>
              <div class="menu-tip">点击任意屏幕推进台词</div>
            </div>

            <!-- 演出 -->
            <div id="stage" class="panel hidden">
              <div class="stage-head">
                <span id="actName" class="act-name"></span>
                <span id="actCount" class="act-count"></span>
              </div>
              <div id="lineBox" class="line-box">
                <div id="speaker" class="speaker"></div>
                <div id="lineText" class="line-text"></div>
              </div>
              <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
              <div class="ctrl">
                <button id="btnMenu" class="ds-btn" title="节目单">☰</button>
                <button id="btnPause" class="ds-btn" title="暂停/继续">⏸</button>
                <button id="btnPrev" class="ds-btn" title="上一幕">◀幕</button>
                <button id="btnNext" class="ds-btn" title="下一幕">幕▶</button>
                <button id="btnSound" class="ds-btn" title="声音开关">♪</button>
              </div>
            </div>

            <!-- 完整剧本 -->
            <div id="scriptView" class="panel hidden">
              <div class="script-head">完 整 剧 本</div>
              <div id="scriptBody" class="script-body"></div>
              <button id="btnBack" class="ds-btn">← 返 回 节 目 单</button>
            </div>

          </div>
          <div class="scanlines"></div>
        </div>

        <!-- 装饰：方向键 + ABXY -->
        <div class="ds-controls">
          <div class="dpad"><div class="dpad-dot"></div></div>
          <div class="face">
            <div class="col">
              <span class="btn-round">X</span>
              <span class="btn-round">B</span>
            </div>
            <div class="col">
              <span class="btn-round">Y</span>
              <span class="btn-round">A</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">点击/触摸任意屏幕 = 推进台词 · 方向键切换幕次 · 空格暂停 · M 静音</p>
</div>

<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/script.js"></script>
<script src="js/scenes.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
