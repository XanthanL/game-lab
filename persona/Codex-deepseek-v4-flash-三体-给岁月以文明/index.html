<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三体 · 给岁月以文明 — NDS 像素舞台剧</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="desk">
  <h1 class="cartridge-title">THREE-BODY <span>DS</span></h1>

  <div id="nds">
    <div class="screen-wrap" id="top-wrap">
      <canvas id="screen-top" width="256" height="192"></canvas>
      <div class="gloss"></div>
    </div>

    <div id="middle">
      <span id="brand">NDS&nbsp;·&nbsp;Three-Body</span>
      <span id="mic"></span>
      <span id="led"></span>
    </div>

    <div class="screen-wrap" id="bottom-wrap">
      <canvas id="screen-bottom" width="256" height="192"></canvas>
      <div class="gloss"></div>
    </div>

    <div id="controls">
      <div class="dpad" id="dpad">
        <button data-key="UP" class="dpad-btn up" aria-label="上">▲</button>
        <button data-key="LEFT" class="dpad-btn left" aria-label="左">◀</button>
        <button data-key="RIGHT" class="dpad-btn right" aria-label="右">▶</button>
        <button data-key="DOWN" class="dpad-btn down" aria-label="下">▼</button>
      </div>
      <div class="abxy" id="abxy">
        <button data-key="Y" class="ab ab-y">Y</button>
        <button data-key="X" class="ab ab-x">X</button>
        <button data-key="B" class="ab ab-b">B</button>
        <button data-key="A" class="ab ab-a">A</button>
      </div>
      <div class="start-select">
        <button data-key="SELECT">SELECT</button>
        <button data-key="START">START</button>
      </div>
    </div>

    <div class="speaker" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </div>

  <p class="foot-note">纯前端实现 · 剧本 / 演出 / 美术 / 音效 / 舞台调度全部在浏览器中完成</p>
</div>

<script src="js/engine.js"></script>
<script src="js/script.js"></script>
<script src="js/play.js"></script>
</body>
</html>
