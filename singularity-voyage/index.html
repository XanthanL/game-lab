<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="奇点旅途 SINGULARITY VOYAGE — 像素风太空弹幕射击。穿越十二段航程，抵达奇点。">
<meta name="theme-color" content="#05060d">
<title>奇点旅途 · SINGULARITY VOYAGE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%231a1c2c'/><rect x='5' y='3' width='3' height='2' fill='%2373eff7'/><rect x='2' y='3' width='2' height='2' fill='%233b5dc9'/><rect x='0' y='3' width='2' height='2' fill='%23ffcd75'/></svg>">
<link rel="preload" href="assets/fusion-pixel-12.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>

  <div id="loading" class="ov"><div class="blink">LOADING...</div></div>

  <!-- 中英切换。
       ⚠️ 它**不能**放进 #title 里：.ov 靠「首个子元素 margin-top:auto + 末个子元素
          margin-bottom:auto」做垂直居中，插一个绝对定位的子元素进去会顶掉
          :first-child / :last-child 的匹配，整个标题页的居中就塌了。
          放在 #wrap 这一层，由 JS 按 state 显隐（只标题页出现）。 -->
  <button id="btn-lang" class="btn small langbtn" data-act="lang" data-i18n-title="lang.title">EN</button>

  <!-- ============ 标题 ============ -->
  <div id="title" class="ov hidden">
    <div class="logo">
      <div class="t1" data-i18n="title.logo1">奇点旅途</div>
      <div class="t2" data-i18n-html="title.logo2">S I N G U L A R I T Y &nbsp; V O Y A G E</div>
    </div>
    <div class="tagline" data-i18n="title.tag">像素太空弹幕射击 · 穿越十二段航程 · 无尽深渊</div>
    <div class="menu">
      <!-- 只在有续档快照时出现（toTitle 里控制显隐） -->
      <!-- ⚠️ 这个 act 不能叫 resume —— 暂停面板的「继续」已经占了 resume（= togglePause）。
           同名会让点暂停「继续」变成去读档。 -->
      <button class="btn primary hidden" id="btn-continue" data-act="continue">继续航程</button>
      <button class="btn primary" id="btn-start" data-act="hangar" data-i18n-html="title.start">&gt; 开始航行</button>
      <div class="menu row">
        <button class="btn" data-act="codex" data-i18n="title.codex">图鉴</button>
        <button class="btn" data-act="help" data-i18n="title.help">操作说明</button>
      </div>
      <button class="btn small hidden" id="btn-clrrun" data-act="clrrun" data-i18n="title.clrrun">放弃这段航程</button>
    </div>
    <div class="best" id="best"></div>
    <div class="volbox" id="vol-title"></div>
    <div class="ctrl-hint desk-only" data-i18n="title.ctrlDesk">A/D 转向 · W 推进 · S 制动 · 鼠标瞄准 · 左键/空格开火 · Shift/右键冲刺</div>
    <div class="ctrl-hint touch-only" data-i18n="title.ctrlTouch">左半屏拖动推进与转向 · 右半屏拖动瞄准并自动开火</div>
    <div class="hint blink desk-only" data-i18n="title.hintDesk">按 ENTER 开始</div>
    <div class="hint blink touch-only" data-i18n="title.hintTouch">轻触「开始航行」</div>
  </div>

  <!-- ============ 机库 / 船体选择 ============ -->
  <div id="hangar" class="ov hidden">
    <div class="up-title" data-i18n="hangar.title">选择船体</div>
    <div id="hull-sub" class="dim" data-i18n="hangar.sub">方向键左右切换 · ENTER 出击</div>
    <div id="hulls"></div>
    <div id="hull-detail" class="panel narrow"></div>
    <div class="menu row">
      <button class="btn primary" data-act="launch" data-i18n="hangar.launch">出击 [ENTER]</button>
      <button class="btn" data-act="title" data-i18n="btn.back">返回</button>
    </div>
  </div>

  <!-- ============ 操作说明 ============ -->
  <div id="help" class="ov hidden">
    <div class="panel">
      <div class="ptitle" data-i18n="help.title">操作说明</div>
      <div class="cols">
        <div data-i18n-html="help.col1"></div>
        <div data-i18n-html="help.col2"></div>
      </div>
      <button class="btn" data-act="helpback" data-i18n="btn.back">返回</button>
    </div>
  </div>

  <!-- ============ 图鉴 ============ -->
  <div id="codex" class="ov hidden">
    <div class="up-title" data-i18n="codex.title">图鉴</div>
    <div id="codex-tabs" class="menu row"></div>
    <div id="codex-count" class="dim"></div>
    <!-- ⚠️ 29 张模块卡会排到 800px 以上，这块必须自己滚：
         .ov 虽然也能滚，但让页签和「返回」跟着一起滚走就很难用了。 -->
    <div id="codex-grid" class="cdgrid"></div>
    <button class="btn primary" data-act="codexback" data-i18n="btn.back">返回</button>
  </div>

  <!-- ============ 升级选卡 ============ -->
  <div id="upgrade" class="ov hidden">
    <div class="up-title" data-i18n="up.title">模块装配 · 选择一项</div>
    <div id="up-sub" class="dim"></div>
    <div id="cards"></div>
    <button id="btn-reroll" class="btn small" data-act="reroll">重抽 [R]</button>
  </div>

  <!-- ============ 暂停 ============ -->
  <div id="pause" class="ov hidden">
    <div class="panel">
      <div class="ptitle" data-i18n="pause.title">暂停</div>
      <div id="pause-stats" class="dim"></div>
      <!-- 当前舰体：把这一局的配件整船画出来，装配结果肉眼可见（drawShipView） -->
      <div id="shipview-box">
        <canvas id="shipview" width="128" height="96"></canvas>
        <div id="shipview-cap" class="dim"></div>
      </div>
      <div id="build"></div>
      <div class="volbox" id="vol-pause"></div>
      <div class="menu row">
        <button class="btn primary" data-act="resume" data-i18n="pause.resume">继续</button>
        <button class="btn" id="btn-mute" data-act="mute" data-i18n="pause.mute">声音</button>
        <button class="btn" data-act="codex" data-i18n="title.codex">图鉴</button>
        <button class="btn" data-act="help" data-i18n="title.help">操作说明</button>
      </div>
      <div class="menu row">
        <button class="btn" data-act="savequit" data-i18n="pause.savequit">保存并退出</button>
        <button class="btn" data-act="restart" data-i18n="pause.restart">重新出击</button>
        <button class="btn" data-act="lang" data-i18n-title="lang.title">EN</button>
        <button class="btn" data-act="title" data-i18n="pause.hangar">机库</button>
      </div>
    </div>
  </div>

  <!-- ============ 结算 ============ -->
  <div id="over" class="ov hidden">
    <div class="over-title" id="over-title">航程 · 中断</div>
    <div class="dim" id="over-sub"></div>
    <div id="over-stats"></div>
    <div id="over-rank"></div>
    <div id="over-log" class="logbox"></div>
    <div class="menu row">
      <button class="btn primary" data-act="restart" data-i18n="over.again">再来一次 [ENTER]</button>
      <button class="btn" data-act="hangar" data-i18n="pause.hangar">机库</button>
      <button class="btn" data-act="codex" data-i18n="title.codex">图鉴</button>
      <button class="btn" data-act="lang" data-i18n-title="lang.title">EN</button>
    </div>
  </div>

  <!-- 触屏操作。右侧是「一大一小两颗按钮 + 一个容器」：
         · 开火开关（最大，贴右下角 —— 拇指支点，最常按）
         · 冲刺（稍小，在它左边）
         · 超载（容器式：能量灌满才按得动，水位由 syncOdBtn 每帧刷进 .odfill）
       ⚠️ 每个按钮的文案都挂在**内层 span** 上：data-i18n 走的是 textContent，
          挂在外层会把里面的 .odfill（能量水位）一起清掉。
       ⚠️ 三者的 rect 互不重叠、各留 8px 以上间距 —— 触屏按钮挨在一起必然误触。
       ⚠️ 暂停 / 全屏是**工具键**，放在顶栏正中那条空档（y=36）—— 两个上角被 HUD
          的血量 / 航段文字占着，压上去会把它们盖住（见 style.css 里那段注释）。 -->
  <div id="touch">
    <button class="tbtn tb-pause" data-act="pause">II</button>
    <button class="tbtn tb-full" data-act="full" data-i18n="touch.full">全</button>
    <button class="tbtn tb-od" id="btn-od" data-act="od" aria-label="超载">
      <span class="odfill"></span><span class="odtext" data-i18n="touch.od">燃</span>
    </button>
    <button class="tbtn tb-fire" id="btn-fire" data-act="fire" aria-pressed="false">
      <span class="firetext" data-i18n="touch.fire">开火</span>
      <span class="firestate" id="fire-state"></span>
    </button>
    <button class="tbtn tb-dash" data-act="dash" data-i18n="touch.dash">冲</button>
  </div>
</div>

<!-- 竖屏提示：只在「粗指针 + 竖屏」时出现，横过来自动消失。
     整块可点 —— 万一判定卡住，玩家必须还有办法绕开，否则一张遮罩就让游戏永久不可玩 -->
<div id="rotate" data-act="rotatedismiss">
  <div class="rt" data-i18n="rotate.t">请把手机横过来</div>
  <div class="rs" data-i18n-html="rotate.s">R O T A T E&nbsp;&nbsp;T O&nbsp;&nbsp;L A N D S C A P E</div>
  <div class="rx" data-i18n="rotate.x">轻触此处仍然继续</div>
</div>
<script src="src/i18n.js"></script>
<script src="src/audio.js"></script>
<script src="src/sprites.js"></script>
<script src="src/game.js"></script>
</body>
</html>
