<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>植物大战僵尸</title>
  <!-- 微信 / Open Graph 分享卡片 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GAME LAB">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="植物大战僵尸 | GAME LAB">
  <meta property="og:description" content="经典塔防玩法复刻 · 重制版：自适应 PC/手机、精美图标、23 关 6 世界、26 种植物与 17 种僵尸、含两大 Boss。">
  <meta property="og:image" content="https://xanthanl.github.io/game-lab/PVZ/og.png">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="800">
  <meta property="og:url" content="https://xanthanl.github.io/game-lab/PVZ/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="植物大战僵尸 | GAME LAB">
  <meta name="twitter:description" content="经典塔防玩法复刻 · 重制版：自适应 PC/手机、精美图标、23 关 6 世界、26 种植物与 17 种僵尸、含两大 Boss。">
  <meta name="twitter:image" content="https://xanthanl.github.io/game-lab/PVZ/og.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="gameCanvas"></canvas>

    <div id="menu" class="overlay hidden">
      <h1>植物大战僵尸</h1>
      <p class="subtitle">重制版 · 自适应 PC / 手机</p>
      <button id="startBtn">开始游戏</button>
      <div class="volume-row">
        <label for="menuVolume">音量</label>
        <input id="menuVolume" type="range" min="0" max="100" step="5">
      </div>
      <p class="tip">选择关卡 · 种植物 · 守住房子</p>
    </div>

    <div id="levelSelect" class="overlay hidden">
      <h1>选择关卡</h1>
      <div id="levelBtns" class="level-grid"></div>
      <button id="levelBackBtn" class="secondary">返回</button>
    </div>

    <div id="pausePanel" class="overlay hidden">
      <h1>暂停</h1>
      <div class="btn-col">
        <button id="resumeBtn">继续游戏</button>
        <button id="speedBtn">速度: 1x</button>
        <div class="volume-row">
          <label for="pauseVolume">音量</label>
          <input id="pauseVolume" type="range" min="0" max="100" step="5">
        </div>
        <button id="pauseRetryBtn">重新开始</button>
        <button id="pauseBackBtn" class="secondary">返回菜单</button>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <h1 id="resultTitle">胜利！</h1>
      <p id="resultMsg"></p>
      <div class="btn-row">
        <button id="retryBtn">重新开始</button>
        <button id="nextBtn">下一关</button>
        <button id="backBtn" class="secondary">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- 手机竖屏提示：请横屏游玩 -->
  <div id="rotateHint" class="hidden">
    <div class="rotate-inner">
      <div class="rotate-icon"></div>
      <p>请横屏游玩</p>
      <p class="rotate-sub">将手机旋转至横屏以获得最佳体验</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/art/draw.js"></script>
  <script src="js/art/sprites.js"></script>
  <script src="js/systems/collision.js"></script>
  <script src="js/systems/save.js"></script>
  <script src="js/systems/audio.js"></script>
  <script src="js/entities/plant.js"></script>
  <script src="js/entities/zombie.js"></script>
  <script src="js/entities/projectile.js"></script>
  <script src="js/entities/effect.js"></script>
  <script src="js/systems/sun.js"></script>
  <script src="js/systems/seed.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
