<!-- 先渲染卡片，再加载 i18n.js —— 这样卡片里的 data-zh/data-en 能被 i18n 的 apply() 一起翻译，
     后加载的 interactions.js 也能给这些卡片挂上涟漪。顺序不能换。 -->
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var PH = { zh: '筛选：名称 / 目录…', en: 'Filter by name / folder…' };
  var state = { sites: [] };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function parseBaked() {
    try {
      var data = JSON.parse($('#sites-data').textContent);
      return Array.isArray(data.sites) ? data.sites : [];
    } catch (e) {
      console.error('sites-data 解析失败：', e);
      return [];
    }
  }

  /* 每个子站点只给一个入口：标题链到它的首页，其余子页面不再摊成一片标签。 */
  function cardHTML(s, i) {
    var ok = s.status === 'ok';
    var pages = ok && Array.isArray(s.pages) ? s.pages : [];
    var entry = pages[0] || null;
    var title = s.name || s.dir;
    var num = (i + 1) < 10 ? '0' + (i + 1) : String(i + 1);

    var bits = [];
    if (s.updated) bits.push(esc(s.updated));
    if (pages.length > 1) bits.push(pages.length + ' <span data-zh="页" data-en="pages">页</span>');

    var inner =
      '<span class="card-top">' +
        '<span class="card-tag" data-zh="' + (ok ? '样例' : '进行中') + '" data-en="' + (ok ? 'SAMPLE' : 'WIP') + '">' + (ok ? '样例' : '进行中') + '</span>' +
        '<span class="card-num">' + num + '</span>' +
        '<span class="card-go">→</span>' +
      '</span>' +
      '<span class="card-main">' +
        '<span class="card-title">' + esc(title) + '</span>' +
        (bits.length ? '<span class="card-what">' + bits.join(' · ') + '</span>' : '') +
      '</span>' +
      '<span class="card-meta"><span class="card-dir">' + esc(s.dir) + '/</span></span>';

    return entry
      ? '<a class="card card-s3 reveal" href="' + esc(entry.path) + '">' + inner + '</a>'
      : '<div class="card card-s3 reveal">' + inner + '</div>';
  }

  function render() {
    var q = $('#q').value.trim().toLowerCase();
    var list = state.sites.filter(function (s) {
      if (!q) return true;
      return (s.dir + ' ' + (s.name || '')).toLowerCase().indexOf(q) !== -1;
    });
    $('#grid').innerHTML = list.length
      ? list.map(cardHTML).join('')
      : '<p class="empty">' + esc(q) + '</p>';
    $('#count-all').textContent = state.sites.length;
  }

  /* placeholder 不吃 data-zh，只能自己跟着 <html data-lang> 换 */
  function syncPh() {
    var lg = document.documentElement.getAttribute('data-lang') === 'en' ? 'en' : 'zh';
    $('#q').setAttribute('placeholder', PH[lg]);
  }

  $('#q').addEventListener('input', render);
  state.sites = parseBaked();
  render();
  syncPh();
  if (window.MutationObserver) {
    new MutationObserver(syncPh).observe(document.documentElement,
      { attributes: true, attributeFilter: ['data-lang'] });
  }
})();
</script>
