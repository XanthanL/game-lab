<!-- 先渲染卡片，再加载 i18n.js —— 这样卡片里的 data-zh/data-en 能被 i18n 的 apply() 一起翻译，
     后加载的 interactions.js 也能给这些卡片挂上涟漪。顺序不能换。 -->
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var state = { sites: [] };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function parseBaked() {
    try {
      var data = JSON.parse($('#sites-data').textContent);
      return Array.isArray(data.sites) ? data.sites : [];
    } catch (e) {
      console.error('sites-data 解析失败：', e);
      return [];
    }
  }

  /* 每个子站点只给一个入口。这里渲染的是无 WebGL / 减少动效时的兜底：
     一列朴素链接，不是卡片堆；轮播接管后会被 viscose.js 收起来。
     站名与介绍跟着 <html data-lang> 走 —— 两种语言各写进 data-zh / data-en，
     交给 i18n.js 的 apply() 统一翻（所以这个脚本要在 i18n.js 之前跑）。 */
  function itemHTML(s, i) {
    var ok = s.status === 'ok';
    var pages = ok && Array.isArray(s.pages) ? s.pages : [];
    var entry = pages[0] || null;
    var nameZh = s.nameZh || s.name || s.dir;
    var nameEn = s.nameEn || nameZh;
    var descZh = s.descZh || '';
    var descEn = s.descEn || descZh;
    var num = (i + 1) < 10 ? '0' + (i + 1) : String(i + 1);

    var bits = [];
    if (s.updated) bits.push(esc(s.updated));
    if (pages.length > 1) bits.push(pages.length + ' <span data-zh="页" data-en="pages">页</span>');

    var inner =
      '<span class="rl-num">' + num + '</span>' +
      '<span class="rl-main">' +
        '<b data-zh="' + esc(nameZh) + '" data-en="' + esc(nameEn) + '">' + esc(nameZh) + '</b>' +
        (descZh
          ? '<span class="rl-desc" data-zh="' + esc(descZh) + '" data-en="' + esc(descEn) + '">' +
              esc(descZh) + '</span>'
          : '') +
        '<span class="rl-sub">' + esc(s.dir) + '/' +
          (bits.length ? ' · ' + bits.join(' · ') : '') + '</span>' +
      '</span>';

    return entry
      ? '<li><a class="rl-row" href="' + esc(entry.path) + '">' + inner + '</a></li>'
      : '<li><span class="rl-row">' + inner + '</span></li>';
  }

  /* 没有筛选框了 —— 这一列就是全部站点，不做过滤。
     轮播启用后会被 viscose.js 收起来，所以它只在兜底时露面。 */
  function render() {
    $('#ringList').innerHTML = state.sites.map(itemHTML).join('');
  }

  state.sites = parseBaked();
  render();
})();
</script>
