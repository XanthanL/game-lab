<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choir of Static — 可视化播放器</title>
<style>
  :root {
    --accent: #ff4fa0;
    --accent2: #00e0d0;
    --ink: rgba(236, 228, 248, 0.88);
    --ink-dim: rgba(236, 228, 248, 0.45);
    --panel: rgba(12, 10, 20, 0.55);
    --reel-metal: rgba(206, 196, 176, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #070510;
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 背景层 ---------- */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.05; mix-blend-mode: overlay;
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAIAAADTED8xAAAAyUlEQVR4nO3OMQ0AAAwCINu/9M3hR1CqA0kAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADwBBSLAAHfCO2sAAAAAElFTkSuQmCC");
    background-repeat: repeat;
  }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,0.62) 100%);
  }

  /* ---------- 舞台 ---------- */
  #stage {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    padding: clamp(12px, 3vh, 36px) clamp(12px, 4vw, 64px);
  }

  /* ---------- 头部 ---------- */
  header { text-align: center; }
  .eyebrow {
    font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 10px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 300; letter-spacing: 0.24em;
    text-shadow: 0 0 24px rgba(255, 79, 160, 0.35), 0 0 60px rgba(0, 224, 208, 0.18);
  }
  .meta {
    margin-top: 8px; font-size: 12px; letter-spacing: 0.24em;
    color: var(--ink-dim); text-transform: uppercase;
  }

  /* ---------- 可视化区 ---------- */
  .viz {
    flex: 1; position: relative; min-height: 0;
  }
  #viz { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* 磁带盘 */
  .reel {
    position: absolute; top: 50%; width: clamp(84px, 15vmin, 150px);
    aspect-ratio: 1; border-radius: 50%;
    transform: translateY(-50%);
    background:
      repeating-conic-gradient(from 0deg,
        rgba(214, 204, 184, 0.10) 0deg 5deg,
        rgba(16, 14, 22, 0.92) 5deg 11deg);
    box-shadow:
      inset 0 0 0 6px rgba(10, 9, 14, 0.9),
      inset 0 0 0 8px rgba(214, 204, 184, 0.14),
      inset 0 0 22px rgba(0, 0, 0, 0.7),
      0 0 34px rgba(255, 79, 160, 0.10);
    animation: spin 3.6s linear infinite;
    animation-play-state: paused;
    opacity: 0.9;
  }
  .reel::before {
    content: ""; position: absolute; inset: 30%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #3c3630, #17141a 70%);
    box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.8);
  }
  .reel::after {  /* 中心孔 */
    content: ""; position: absolute; inset: 44%;
    border-radius: 50%;
    background: #0b0910;
    box-shadow: inset 0 0 4px #000;
  }
  .reel-l { left: clamp(6px, 5vw, 72px); }
  .reel-r { right: clamp(6px, 5vw, 72px); animation-direction: reverse; }
  body.playing .reel { animation-play-state: running; }
  @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

  /* 中心核心（段落/时钟/REC） */
  .core {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(130px, 24vmin, 210px); aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 13, 26, 0.62), rgba(10, 8, 18, 0.10) 72%);
    backdrop-filter: blur(2px);
    pointer-events: none;
  }
  .rec-light {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff2e4d; box-shadow: 0 0 8px #ff2e4d;
    opacity: 0.25;
  }
  body.playing .rec-light { animation: recblink 1.1s ease-in-out infinite; }
  @keyframes recblink {
    0%, 100% { opacity: 0.25; box-shadow: 0 0 6px rgba(255,46,77,0.4); }
    50% { opacity: 1; box-shadow: 0 0 14px rgba(255,46,77,1); }
  }
  .section-tag {
    font-size: clamp(11px, 1.8vmin, 15px); letter-spacing: 0.30em;
    color: var(--ink); text-transform: uppercase;
    transition: opacity 0.18s;
  }
  .section-tag.flash { animation: tagflash 0.4s ease; }
  @keyframes tagflash { 0% { opacity: 0.2; } 100% { opacity: 1; } }
  .clock { font-size: clamp(12px, 2vmin, 16px); color: var(--ink-dim); letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }

  /* ---------- 控制条 ---------- */
  footer {
    display: flex; align-items: center; gap: clamp(10px, 2vw, 22px);
    padding: 14px 18px; border-radius: 999px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    margin-top: 12px;
  }
  #play {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.16);
    background: linear-gradient(135deg, rgba(255,79,160,0.9), rgba(123,47,255,0.85));
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255, 79, 160, 0.35);
    transition: transform 0.12s, box-shadow 0.2s;
  }
  #play:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(255, 79, 160, 0.55); }
  #play:active { transform: scale(0.97); }
  #play svg { width: 22px; height: 22px; fill: #fff; }
  #play .icon-pause { display: none; }
  body.playing #play .icon-play { display: none; }
  body.playing #play .icon-pause { display: block; }

  .track { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .time { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; white-space: nowrap; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; border: none; background: #fff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  }
  #seek { flex: 1; min-width: 60px; }
  #vol { width: clamp(70px, 12vw, 120px); }
  .vol-label { font-size: 13px; color: var(--ink-dim); }

  /* 提示（file:// 打开时） */
  #hint {
    position: fixed; left: 50%; bottom: calc(96px + 4vh); transform: translateX(-50%);
    z-index: 5; display: none;
    padding: 8px 16px; border-radius: 8px; font-size: 12px;
    background: rgba(40, 20, 40, 0.85); border: 1px solid rgba(255, 79, 160, 0.4);
    color: var(--ink); letter-spacing: 0.06em;
  }
  #hint.show { display: block; }

  /* 本地文件模式常驻横幅 */
  #fileBanner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6;
    display: none;
    align-items: center; justify-content: center; gap: 8px;
    padding: 9px 14px;
    font-size: 12px; letter-spacing: 0.04em;
    background: rgba(46, 16, 44, 0.88);
    border-bottom: 1px solid rgba(255, 79, 160, 0.35);
    color: var(--ink);
  }
  #fileBanner.show { display: flex; }
  #fileBanner code {
    background: rgba(255,255,255,0.09); padding: 2px 7px; border-radius: 4px;
    font-family: Consolas, "Courier New", monospace; color: var(--accent2);
  }
  #bannerClose {
    background: none; border: none; color: var(--ink-dim); cursor: pointer;
    font-size: 13px; padding: 2px 6px; margin-left: 6px;
  }
  #bannerClose:hover { color: var(--ink); }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="grain"></div>
  <div class="vignette"></div>

  <div id="stage">
    <header>
      <div class="eyebrow">Blood Cultures · style track</div>
      <h1>Choir of Static</h1>
      <div class="meta">experimental indie pop · 88 bpm · d major / ♭vii</div>
    </header>

    <div class="viz">
      <canvas id="viz"></canvas>
      <div class="reel reel-l"></div>
      <div class="reel reel-r"></div>
      <div class="core">
        <div class="rec-light"></div>
        <div class="section-tag">—</div>
        <div class="clock">0:00 / 0:00</div>
      </div>
    </div>

    <footer>
      <button id="play" aria-label="播放 / 暂停">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="track">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0">
        <span class="time" id="tDur">1:28</span>
        <span class="vol-label">♪</span>
        <input type="range" id="vol" min="0" max="100" value="80">
      </div>
    </footer>
  </div>

  <div id="hint">建议通过本地服务器打开（py -m http.server 8000）以获得完整可视化</div>
  <div id="fileBanner">
    <span>本地文件模式：音频已启用，但浏览器限制了频谱可视化。运行</span>
    <code>py -m http.server 8000</code>
    <span>后访问</span>
    <code>http://localhost:8000</code>
    <button id="bannerClose" aria-label="关闭">✕</button>
  </div>

  <script src="player.js"></script>
</body>
</html>
