<!-- 主题在样式生效前定好，避免刷新时闪一下白/黑 -->
<script>
(function () {
  var d = document.documentElement;
  d.classList.add("js");
  try {
    var t = localStorage.getItem("gl-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    d.setAttribute("data-theme", t);
    /* 风格：默认电光蓝（hermes）；若用户之前在皮肤条手动选过并写回 gl-style，则沿用。
       从首页点进子页时是同一套、不会跳变；在皮肤条上手动选仍然有效。 */
    var OK = ["glass","soft","raw","crete","xp","w7","w10","classic","dream","pool","weird","mc","gtavc","gtasa","gta4","gta5","pipboy","construct", "blueprint", "fc", "synthwave", "glitch", "clay", "cyberpunk", "rdr2", "p5", "aperture", "halo", "splatoon", "pokemon", "crt", "gb", "winamp", "dos", "mac7", "bauhaus", "deco", "memphis", "pop", "swiss", "vaporwave", "washi", "morandi", "skate", "decon", "ink", "futurism", "hermes","klein","diagonal","shanshui","borderlands"];
    var st = localStorage.getItem("gl-style");
    if (!st || OK.indexOf(st) === -1) st = "hermes";
    d.setAttribute("data-style", st);
  } catch (e) {}
})();
</script>

<!-- 分类切换 + 兜底列表。
     必须在 ring.js 之前跑：ring.js 初始化时要读 #lab-data，而这个脚本负责把
     tabs 与兜底列表先渲染出来（列表里的 data-zh/data-en 交给后面的 i18n.js 一起翻）。 -->
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  var data;
  try { data = JSON.parse($('#lab-data').textContent); } catch (e) { data = null; }
  if (!data || !data.cats) return;

  var cats = data.cats;
  var tabsEl = $('#catTabs');
  var listEl = $('#ringList');
  var cur = 0;

  /* 兜底列表：无 WebGL / 减少动效时露出。转盘启用后 ring.js 会把它收起来，
     但内容照样按当前分类更新 —— 万一之后退回列表，看到的得是同一组作品。 */
  function itemHTML(s, i) {
    var entry = (s.pages && s.pages[0]) || null;
    var num = pad2(i + 1);
    var bits = [];
    if (s.tagZh) bits.push('<span data-zh="' + esc(s.tagZh) + '" data-en="' + esc(s.tagEn || s.tagZh) + '">' + esc(s.tagZh) + '</span>');
    var inner =
      '<span class="rl-num">' + num + '</span>' +
      '<span class="rl-main">' +
        '<b data-zh="' + esc(s.nameZh) + '" data-en="' + esc(s.nameEn || s.nameZh) + '">' + esc(s.nameZh) + '</b>' +
        '<span class="rl-desc" data-zh="' + esc(s.descZh || '') + '" data-en="' + esc(s.descEn || s.descZh || '') + '">' + esc(s.descZh || '') + '</span>' +
        '<span class="rl-sub">' + esc(s.dir) + '/' + (bits.length ? ' · ' + bits.join('') : '') + '</span>' +
      '</span>';
    return '<li>' + (entry ? '<a class="rl-row" href="' + esc(entry.path) + '">' + inner + '</a>'
                           : '<span class="rl-row">' + inner + '</span>') + '</li>';
  }

  function renderList(list) {
    if (listEl) listEl.innerHTML = list.map(itemHTML).join('');
  }

  function renderTabs() {
    if (!tabsEl) return;
    tabsEl.innerHTML = cats.map(function (c, i) {
      return '<button type="button" class="cat-tab' + (i === cur ? ' is-on' : '') + '"' +
             ' data-cat="' + esc(c.id) + '"' + (i === cur ? ' aria-current="true"' : '') + '>' +
             '<span data-zh="' + esc(c.zh) + '" data-en="' + esc(c.en) + '">' + esc(c.zh) + '</span>' +
             '<em>' + pad2(c.items.length) + '</em>' +
             '</button>';
    }).join('');
  }

  function pick(i) {
    cur = i;
    var list = cats[i].items;

    if (tabsEl) {
      var bs = tabsEl.querySelectorAll('.cat-tab');
      for (var k = 0; k < bs.length; k++) {
        if (k === i) { bs[k].classList.add('is-on'); bs[k].setAttribute('aria-current', 'true'); }
        else { bs[k].classList.remove('is-on'); bs[k].removeAttribute('aria-current'); }
      }
    }

    renderList(list);

    /* 转盘接管了就换一组数据；没接管（无 WebGL / 减少动效 / 这组不足 3 项）就留着列表。 */
    var swapped = window.__ringSwap ? window.__ringSwap(list) : false;
    if (!swapped && listEl) listEl.hidden = false;

    /* 换语言时 tabs 与列表是静态 data-zh/data-en，i18n 的 apply() 会翻；
       转盘卡片是脚本拼的，ring.js 自己监听 data-lang 重画。 */
    try { location.hash = cats[i].id; } catch (e) {}
  }

  renderTabs();
  renderList(cats[0].items);

  if (tabsEl) {
    tabsEl.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.cat-tab') : null;
      if (!b) return;
      var i = Array.prototype.indexOf.call(tabsEl.querySelectorAll('.cat-tab'), b);
      if (i >= 0) pick(i);
    });
  }

  /* 带 #creations / #lab 进来时直接落到那一类 */
  var h = (location.hash || '').replace(/^#/, '');
  for (var j = 0; j < cats.length; j++) {
    if (cats[j].id === h && j !== 0) { pick(j); break; }
  }

  window.__labPick = pick;
})();
</script>

<!-- 风格面板开关：点按钮展开 / 收起，点面板外或按 Esc 关闭。
     放在 i18n.js 之前不影响 —— 面板里的芯片由 i18n.js 注入，这里只管容器的开合。 -->
<script>
(function () {
  'use strict';
  var t = document.getElementById('skinToggle');
  var pn = document.getElementById('skinPanel');
  if (!t || !pn) return;
  function set(open) {
    pn.hidden = !open;
    t.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  t.addEventListener('click', function (e) { e.stopPropagation(); set(pn.hidden); });
  document.addEventListener('click', function (e) {
    if (pn.hidden) return;
    if (pn.contains(e.target) || t.contains(e.target)) return;
    set(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !pn.hidden) { set(false); t.focus(); }
  });
})();
</script>
<script src="./assets/ring.js"></script>
<script src="./assets/i18n.js"></script>
<script src="./assets/interactions.js"></script>
</body>
</html>
