<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共振纪元 | RESONANCE ERA</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body data-theme="dark">
    <!-- Header -->
    <header class="novel-header">
        <div class="header-content">
            <a href="../index.html" class="back-link">← GAME LAB</a>
            <div class="title-block">
                <h1 class="novel-title">共振纪元</h1>
                <h2 class="novel-title-en">RESONANCE ERA</h2>
                <p class="novel-tagline">硬科幻 / 反乌托邦 / 革命叙事</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="novel-container">
        <!-- Navigation Sidebar -->
        <aside class="sidebar">
            <div class="chapter-nav">
                <h3 class="section-title">目录 / CONTENTS</h3>
                <nav id="chapter-list">
                    <!-- Chapters will be loaded here -->
                </nav>
            </div>
            
            <div class="reading-settings">
                <h3 class="section-title">阅读设置</h3>
                <div class="setting-group">
                    <label for="font-size">字号</label>
                    <input type="range" id="font-size" min="14" max="24" value="18">
                </div>
                <div class="setting-group">
                    <label for="line-height">行距</label>
                    <input type="range" id="line-height" min="1.2" max="2.0" step="0.1" value="1.8">
                </div>
                <div class="setting-group">
                    <label>主题</label>
                    <button id="theme-toggle" class="btn-secondary">切换深色/浅色</button>
                </div>
            </div>
        </aside>

        <!-- Book Content -->
        <article id="book-content" class="book-content">
            <!-- Chapter content will be loaded here -->
        </article>

        <!-- Navigation Buttons -->
        <nav class="chapter-controls">
            <button id="prev-chapter" class="btn btn-control">← 上一章</button>
            <button id="to-catalog" class="btn btn-control">返回目录</button>
            <button id="next-chapter" class="btn btn-control">下一章 →</button>
        </nav>
    </main>

    <!-- Footer -->
    <footer class="novel-footer">
        <p>&copy; 2026 共振纪元 | A Hard Science Fiction Novel by XanthanL</p>
        <p>一部关于自由意志、认知解放与集体觉醒的长篇硬科幻小说</p>
    </footer>

    <script src="./assets/chapters.js"></script>
    <script src="./assets/novel.js"></script>
</body>
</html>
