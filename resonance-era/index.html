<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>共振纪元 | RESONANCE ERA</title>
<meta name="description" content="硬科幻长篇《共振纪元》在线阅读：25 章，架空宇宙纪元 1018 年，六层级社会与 12.7Hz 共振频率。">
<meta name="theme-color" content="#002FA7">
<!-- 挂在 game-lab 域名下：canonical 与 og:url 都写绝对路径，别让搜索引擎以为它是独立站点 -->
<link rel="canonical" href="https://xanthanl.github.io/game-lab/resonance-era/">
<meta property="og:type" content="book">
<meta property="og:site_name" content="GAME LAB">
<meta property="og:title" content="共振纪元 | RESONANCE ERA">
<meta property="og:description" content="硬科幻长篇《共振纪元》在线阅读：25 章，架空宇宙纪元 1018 年，六层级社会与 12.7Hz 共振频率。">
<meta property="og:url" content="https://xanthanl.github.io/game-lab/resonance-era/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23002FA7'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23EDFF45' stroke-width='2'/%3E%3C/svg%3E">

<!-- 主题在样式生效前定好，避免刷新时闪一下 -->
<script>
(function () {
  var d = document.documentElement;
  try {
    var t = localStorage.getItem("re-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    d.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="./assets/style.css">
</head>

<body data-view="catalog">

<div class="progress" aria-hidden="true"><i id="progressFill"></i></div>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" type="button" aria-label="打开目录" aria-expanded="false">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    <span>目录</span>
  </button>
  <a class="brand" href="#/catalog">
    <b>共振纪元</b>
    <span>Resonance Era</span>
  </a>
  <div class="topbar-right">
    <a class="home" href="../index.html">GAME LAB</a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换日间 / 夜间">夜间</button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="rail" id="rail" aria-label="目录与阅读设置">
    <div class="rail-close">
      <span>Contents</span>
      <button type="button" id="railClose" aria-label="关闭目录">✕</button>
    </div>

    <h2 class="rail-h"><span>目录 / Contents</span><span id="railCount">25 章</span></h2>
    <div id="toc"></div>

    <div class="panel">
      <div class="field">
        <div class="field-h"><span>字号 / Size</span><b id="fsVal">17px</b></div>
        <input type="range" id="fontSize" min="15" max="24" step="1" value="17" aria-label="字号">
      </div>
      <div class="field">
        <div class="field-h"><span>行距 / Leading</span><b id="lhVal">1.9</b></div>
        <input type="range" id="lineHeight" min="1.5" max="2.4" step="0.1" value="1.9" aria-label="行距">
      </div>
      <div class="field">
        <div class="field-h"><span>主题 / Theme</span></div>
        <div class="seg">
          <button type="button" id="themeLight" aria-pressed="true">日间</button>
          <button type="button" id="themeDark" aria-pressed="false">夜间</button>
        </div>
      </div>
    </div>

    <div class="rail-foot">XANTHANL · 2026<br>静态托管 · 无追踪 · 无广告</div>
  </aside>

  <main class="stage">
    <div class="column" id="view"></div>
  </main>
</div>

<nav class="mobilebar" aria-label="章节导航">
  <button type="button" class="toc-btn" id="mbToc">目录</button>
  <button type="button" class="jump prev" id="mbPrev">← 上一章</button>
  <button type="button" class="jump next" id="mbNext">下一章 →</button>
</nav>

<script src="./chapters.js"></script>
<script src="./reader.js"></script>
</body>
</html>
