<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>欧陆风云 · 1444</title>
<meta name="description" content="浏览器大战略游戏：1444 年的欧陆风云，纯静态，无需安装。" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<!-- 生成世界时的加载层 -->
<div id="boot" class="boot">
  <div class="boot-box">
    <div class="boot-title">欧陆风云 · 1444</div>
    <div class="boot-sub">EUROPA UNIVERSALIS</div>
    <div id="bootMsg">正在绘制世界地图、划分省份、安置 82 个国家…</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-tip">首次生成约需 1–3 秒，之后浏览器会缓存脚本。</div>
  </div>
</div>

<!-- 开局选国 -->
<section id="setup" class="setup gone" style="display:none">
  <header class="setup-head">
    <div class="sh-title">
      <h1>选择你的国家</h1>
      <p>1444 年 11 月 11 日 · 中世纪的尾声。点选一个国家，双击可直接开局。</p>
    </div>
    <div class="setup-tools">
      <input id="csSearch" type="search" placeholder="搜索国家 / 标签…" autocomplete="off" />
      <select id="csSort">
        <option value="dev">按发展度</option>
        <option value="prov">按省份数</option>
        <option value="easy">按难度</option>
        <option value="name">按名称</option>
      </select>
      <select id="csFilter"></select>
      <button id="csRandom" type="button">随机</button>
    </div>
  </header>

  <div class="setup-body">
    <div class="cs-list-wrap">
      <div class="cs-count" id="csCount"></div>
      <div class="cs-list" id="csList"></div>
    </div>
    <aside class="cs-side">
      <div class="cs-map-wrap"><canvas id="csMap"></canvas></div>
      <div class="cs-detail" id="csDetail"></div>
      <button id="csStart" class="cs-start" type="button" disabled>开始游戏</button>
    </aside>
  </div>
</section>

<div id="app">
  <header class="topbar">
    <div class="brand">欧陆风云 · 1444</div>
    <div class="who">执政 <b id="topCountry">—</b> <i id="topTag"></i></div>
    <div class="strip">
      <span class="s-gold" title="国库"><b id="topGold">0</b></span>
      <span class="s-bal" title="月度结余" id="topBalance">+0.0</span>
      <span title="可用人力"><b id="topMan">0</b></span>
      <span title="现役兵力 / 陆军上限"><b id="topArmy">0</b>/<b id="topFL">0</b></span>
      <span title="商人 / 可用"><b id="topMerch">0</b></span>
    </div>
    <div class="date" id="date">1444 年 11 月 11 日</div>
    <div class="speed">
      <button type="button" data-speed="0" class="active">暂停</button>
      <button type="button" data-speed="1">1×</button>
      <button type="button" data-speed="2">2×</button>
      <button type="button" data-speed="4">4×</button>
    </div>
  </header>

  <main class="main">
    <aside class="panel left" id="leftPanel"></aside>

    <div class="map-wrap" id="mapWrap">
      <canvas id="map"></canvas>
      <div class="map-modes">
        <button type="button" data-mode="political" class="active">政治</button>
        <button type="button" data-mode="terrain">地形</button>
        <button type="button" data-mode="religion">宗教</button>
        <button type="button" data-mode="culture">文化</button>
        <button type="button" data-mode="tradenode">贸易节点</button>
        <button type="button" data-mode="trade">贸易品</button>
        <button type="button" data-mode="unrest">动荡</button>
      </div>
      <div id="hoverTip" class="hover-tip" hidden></div>
    </div>

    <aside class="panel right">
      <nav class="tabs" id="tabs"></nav>
      <div class="tab-body" id="tabBody"></div>
    </aside>
  </main>

  <footer class="logbar"><div id="log">欢迎来到 1444 年的欧洲。</div></footer>
</div>

<div id="modal" class="modal" hidden><div class="modal-body" id="modalBody"></div></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
